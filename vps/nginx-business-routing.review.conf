# REVIEW ONLY. Do not install until a dedicated production service is validated.
# Place in the HTTPS server block; upstream stays loopback. Do not proxy
# /candidate, /native/auth, the staging service, or arbitrary backend paths.
# The candidate itself is NOT a released production service.
location ~ ^/api/myr/(workspace|records|payments|delete|profile|team|approval|onboard|links/read|links/submit|admin/dashboard|admin/company)$ {
    rewrite ^/api/myr/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header Cookie "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_hide_header Set-Cookie;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;
    add_header Cache-Control "no-store" always;
}
location /api/myr/ {
    return 404;
}
