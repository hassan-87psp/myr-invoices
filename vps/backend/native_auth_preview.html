<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MYR Invoice — Native account candidate</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f9;color:#14243a;font:15px system-ui,sans-serif}main{max-width:440px;margin:7vh auto;padding:28px;background:white;border:1px solid #dce2eb;border-radius:18px}h1{font-size:24px;margin:0 0 8px}p{line-height:1.5;color:#536479}label{display:block;margin:15px 0 5px;font-weight:600}input,select,button{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}button{background:#173b68;color:white;border:0;margin-top:14px;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#e8edf4;color:#173b68}#status{white-space:pre-wrap;overflow-wrap:anywhere}small{display:block;color:#536479;margin-top:12px}[hidden]{display:none!important}@media(max-width:480px){main{margin:12px}}
</style></head><body><main>
<h1>MYR Invoice</h1><p>Private VPS authentication candidate. Business data remains read-only. Email delivery requires configuration.</p>
<label for="mode">Account action</label><select id="mode"><option value="login">Sign in</option><option value="signup">Create account</option><option value="activate-request">Activate imported account</option><option value="reset-request">Forgot password</option><option value="verify-email">Finish email verification</option><option value="activate">Finish account activation</option><option value="reset-password">Finish password reset</option></select>
<form id="form"><div id="emailfield"><label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="254"></div><div id="tokenfield" hidden><label for="token">One-time account token</label><input id="token" autocomplete="off" maxlength="128"></div><div id="namefield" hidden><label for="name">Full name</label><input id="name" autocomplete="name" maxlength="120"></div><div id="passwordfield"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" maxlength="128"></div><button id="submit" type="submit">Continue</button></form>
<button id="workspace" class="secondary" type="button">Check signed-in workspace</button><button id="logout" class="secondary" type="button">Sign out</button><p id="status" role="status" aria-live="polite"></p><small>Never share passwords or activation tokens in chat.</small>
</main><script>
'use strict';
const el=id=>document.getElementById(id),mode=el('mode'),status=el('status');
const finishes=new Set(['verify-email','activate','reset-password']);
function render(){const m=mode.value,f=finishes.has(m);el('emailfield').hidden=f;el('email').required=!f;el('tokenfield').hidden=!f;el('token').required=f;el('namefield').hidden=m!=='verify-email';el('passwordfield').hidden=!(f||m==='login');el('password').required=f||m==='login';el('password').minLength=f?12:1;el('password').autocomplete=f?'new-password':'current-password';el('password').value='';}
mode.addEventListener('change',render);
async function call(path,data){const r=await fetch('/native/'+path,{method:data===undefined?'GET':'POST',credentials:'same-origin',cache:'no-store',headers:data===undefined?{}:{'Content-Type':'application/json'},body:data===undefined?undefined:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw new Error(typeof j.detail==='string'?j.detail:'Request rejected ('+r.status+')');return j}
async function run(fn){status.textContent='';for(const b of document.querySelectorAll('button'))b.disabled=true;try{await fn()}catch(e){status.textContent=e.message}finally{for(const b of document.querySelectorAll('button'))b.disabled=false}}
el('form').addEventListener('submit',e=>{e.preventDefault();run(async()=>{const m=mode.value;let data=finishes.has(m)?{token:el('token').value,password:el('password').value,name:el('name').value}:{email:el('email').value};if(m==='login')data.password=el('password').value;try{await call('auth/'+m,data);status.textContent=m==='login'?'Signed in. Use Check signed-in workspace.':finishes.has(m)?'Account updated. You can now sign in.':'If eligible, an account email will be sent.'}finally{el('password').value='';el('token').value=''}})});
el('workspace').addEventListener('click',()=>run(async()=>{const p=await call('auth/me');const w=await call('workspace');status.textContent='Native session verified: '+p.email+'\nCompanies: '+w.companies.length+'\nRead-only candidate';}));
el('logout').addEventListener('click',()=>run(async()=>{await call('auth/logout',{});status.textContent='Signed out.'}));
render();
</script></body></html>
