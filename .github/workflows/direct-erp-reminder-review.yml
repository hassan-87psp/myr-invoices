name: Direct ERP offline reminder and selection tests
on:
  pull_request:
    paths:
      - 'vps/backend/lhdn_direct_expiry_reminder_candidate.py'
      - 'vps/backend/lhdn_direct_reminder_outbox_candidate.py'
      - 'vps/backend/lhdn_connection_selection_candidate.py'
      - 'vps/backend/lhdn_direct_reminder_job_candidate.py'
      - 'vps/backend/lhdn_direct_reminder_runtime_candidate.py'
      - 'vps/backend/lhdn_receipt_display_candidate.py'
      - 'supabase/functions/myr-transactional-mail/**'
      - '.github/workflows/direct-erp-reminder-review.yml'
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run isolated tests
        run: |
          python3 -B vps/backend/lhdn_direct_expiry_reminder_candidate.py
          python3 -B vps/backend/lhdn_direct_reminder_outbox_candidate.py
          python3 -B vps/backend/lhdn_connection_selection_candidate.py
          python3 -B vps/backend/lhdn_direct_reminder_job_candidate.py
          python3 -B vps/backend/lhdn_direct_reminder_runtime_candidate.py --test
          python3 -B vps/backend/lhdn_receipt_display_candidate.py
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check mail gateway without sending
        run: deno check supabase/functions/myr-transactional-mail/index.ts
