name: Validate MYR Invoices static site

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "config.js"
      - "concurrency.js"
      - "tests/**"
      - ".github/workflows/pages.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Check HTML and JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const html = fs.readFileSync('index.html', 'utf8');
          const config = fs.readFileSync('config.js', 'utf8');
          if (!/<html\b/i.test(html) || !/<script\s+src="config.js">/i.test(html)) {
            throw new Error('Main HTML or config script tag is missing');
          }
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)]
            .filter(m => !/\bsrc\s*=/.test(m[1]));
          if (!scripts.length) throw new Error('No app scripts found');
          scripts.forEach((script, i) => new vm.Script(script[2], { filename: 'inline-' + i + '.js' }));
          new vm.Script(config, { filename: 'config.js' });
          new vm.Script(fs.readFileSync('concurrency.js', 'utf8'), { filename: 'concurrency.js' });
          if (/sb_secret_[a-z0-9_-]+/i.test(config)) throw new Error('Secret key is embedded in the browser config');
          console.log('Validated ' + scripts.length + ' inline scripts and config.js');
          NODE
      - name: Run financial regression tests
        run: |
          node tests/financial.test.cjs
          node tests/invoice-safety.test.cjs
          node tests/concurrency.test.cjs
          node tests/numbering.test.cjs
