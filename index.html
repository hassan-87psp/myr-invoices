.side{width:252px;background:var(--navy);color:#B7C3D6;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;color:#fff}.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand small{color:#8FA3C0;font-size:11.5px}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 12px;border-radius:10px;color:#B7C3D6;font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.on{background:var(--blue);color:#fff}
.nav .cnt{margin-left:auto;font-style:normal;background:#EF4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side-f{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.envpill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06)}.envpill i{width:8px;height:8px;border-radius:50%;background:#F59E0B}.envpill i.ok{background:#10B981}
.main{flex:1;margin-left:252px;min-width:0}
.top{height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px;position:sticky;top:0;z-index:40}
.cosel{max-width:280px;height:38px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase}
.localbar{background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#78350F;font-size:12px;padding:6px 24px;text-align:center}
.content{padding:24px;max-width:1320px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}.ph h1{font-size:24px}.ph p{margin:4px 0 0;color:var(--muted)}
.back{font-size:12.5px;color:var(--muted);display:inline-block;margin-bottom:6px}
.menu-btn{display:none!important}.scrim{display:none}
@media(max-width:1024px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}.side.open+.scrim{display:block;position:fixed;inset:0;background:rgba(11,31,58,.4);z-index:55}.main{margin-left:0}.menu-btn{display:inline-flex!important}.content{padding:16px}.top{padding:0 12px}.hide-sm{display:none}.localbar{padding:6px 12px}}
/* Builder */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.bside{position:sticky;top:84px;display:grid;gap:16px}
@media(max-width:1180px){.bgrid{grid-template-columns:1fr}.bside{position:static}}
.sec{margin-bottom:16px}.sh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.stepn{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center}
.line{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#FCFDFF}
.lgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.lgrid .full{grid-column:1/-1}
@media(max-width:700px){.lgrid{grid-template-columns:1fr 1fr}}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}.tot.big{font-size:18px;font-weight:700;color:var(--navy);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.score{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);flex:none}
.cbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
/* Modal & toast */
.mbk{position:fixed;inset:0;background:rgba(11,31,58,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fade .15s}
.md{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .18s ease}
.md.wide{max-width:900px}.md .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.md .mbd{padding:20px}.md .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:pop .2s;max-width:420px}
.toast.err{background:#991B1B}.toast.warn{background:#92400E}
.skel{background:linear-gradient(90deg,#EEF2F7 25%,#F6F8FB 50%,#EEF2F7 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}@keyframes sk{to{background-position:-200% 0}}
/* Document */
.doc{background:#fff;color:#0F172A;padding:36px;border:1px solid var(--line);border-radius:14px;position:relative;font-size:12.5px;overflow:hidden}
.doc h2{font-size:22px}.doc table{width:100%;border-collapse:collapse;margin-top:18px}.doc th{background:#F1F5FB;color:#334155;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px}.doc td{padding:8px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.doc .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.doc .parties h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin-bottom:6px}
.doc .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:56px;font-weight:800;color:rgba(220,38,38,.08);transform:rotate(-22deg);text-align:center;line-height:1.1}
.doc .lhdn{display:flex;gap:16px;align-items:center;margin-top:22px;padding:14px;border:1px dashed #CBD5E1;border-radius:12px}
.doc .lhdn svg{width:110px;height:110px;flex:none}
@media(max-width:640px){.doc{padding:18px}.doc .parties{grid-template-columns:1fr}}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}#print .doc{border:0;padding:0}@page{margin:14mm}}
/* Public site */
.site{background:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sh-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sh-top .wrap{display:flex;align-items:center;height:68px;gap:24px}
.sh-nav{display:flex;gap:22px;flex:1}.sh-nav a{color:var(--ink2);font-weight:500;cursor:pointer}.sh-nav a:hover{color:var(--blue)}
@media(max-width:900px){.sh-nav{display:none}}
.hero{padding:76px 0 40px;background:linear-gradient(180deg,#F7F9FC 0%,#fff 100%)}
.hero h1{font-size:54px;line-height:1.05;letter-spacing:-.035em;max-width:820px}
.hero .lead{font-size:18px;color:var(--muted);max-width:640px;margin:18px 0 28px}
@media(max-width:700px){.hero{padding:44px 0 24px}.hero h1{font-size:36px}.hero .lead{font-size:16px}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--b50);color:var(--blue);font-weight:600;font-size:12.5px;margin-bottom:18px}
.preview{margin-top:48px;border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(11,31,58,.12);overflow:hidden;background:var(--off)}
.pv-bar{height:38px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px}.pv-bar i{width:10px;height:10px;border-radius:50%;background:#E2E8F0}
.pv{display:grid;grid-template-columns:180px 1fr;min-height:360px}.pv-side{background:var(--navy);padding:16px 12px}.pv-side div{height:28px;border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,.06)}.pv-side div.on{background:var(--blue)}
.pv-main{padding:18px}@media(max-width:700px){.pv{grid-template-columns:1fr}.pv-side{display:none}}
section.s{padding:84px 0}section.s.alt{background:var(--off)}
@media(max-width:700px){section.s{padding:56px 0}}
.sec-h{text-align:center;max-width:720px;margin:0 auto 44px}.sec-h h2{font-size:36px;letter-spacing:-.03em}.sec-h p{color:var(--muted);font-size:16.5px;margin-top:12px}
@media(max-width:700px){.sec-h h2{font-size:28px}}
.feat{padding:24px}.feat .fi{width:42px;height:42px;border-radius:12px;background:var(--b50);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:14px}.feat h3{font-size:16.5px;margin-bottom:6px}.feat p{color:var(--muted);margin:0}
.flag{border:1px solid #C7D7FE;background:linear-gradient(180deg,#F5F8FF,#fff)}
.stepc{padding:24px;position:relative}.stepc .n{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px}
.price{padding:28px;display:flex;flex-direction:column}.price.hl{border:2px solid var(--blue);box-shadow:0 20px 50px rgba(37,99,235,.15)}.price .amt{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-.03em}.price ul{list-style:none;padding:0;margin:18px 0 22px;flex:1}.price li{padding:6px 0;display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}.price li svg{color:var(--ok);flex:none;margin-top:2px}.price li.no{color:#94A3B8}.price li.no svg{color:#CBD5E1}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}.faq summary{font-weight:600;cursor:pointer;color:var(--navy);font-size:15.5px;list-style:none;display:flex;justify-content:space-between}.faq summary::after{content:'+';color:var(--blue);font-size:20px;line-height:1}.faq details[open] summary::after{content:'–'}.faq details p{color:var(--muted);margin:10px 0 0}
.cta{background:var(--navy);color:#fff;border-radius:24px;padding:56px;text-align:center}.cta h2{color:#fff;font-size:34px}.cta p{color:#B7C3D6;font-size:16px;margin:12px 0 26px}
@media(max-width:700px){.cta{padding:36px 22px}.cta h2{font-size:26px}}
footer.ft{background:var(--navy);color:#B7C3D6;padding:56px 0 28px;margin-top:84px}footer.ft h4{color:#fff;font-size:13px;margin-bottom:12px}footer.ft a{color:#B7C3D6;display:block;padding:4px 0;cursor:pointer}footer.ft a:hover{color:#fff}
.cmp td:nth-child(2),.cmp td:nth-child(3),.cmp th:nth-child(2),.cmp th:nth-child(3){text-align:center}
/* Auth & buyer */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-l{background:var(--navy);color:#B7C3D6;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.auth-l h2{color:#fff;font-size:34px;letter-spacing:-.03em}.auth-r{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#fff}.auth-box{width:100%;max-width:400px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-l{display:none}}
.mobile-page{min-height:100vh;background:var(--off);padding:20px 16px 40px}.mobile-page .box{max-width:520px;margin:0 auto}
.upload{border:2px dashed #CBD5E1;border-radius:16px;padding:36px;text-align:center;background:#FCFDFF;cursor:pointer;transition:.15s}.upload:hover{border-color:var(--blue);background:var(--b50)}
.qrwrap svg{width:220px;height:220px}
.chart-bar{transition:opacity .15s}.chart-bar:hover{opacity:.8}

/* Responsive safeguard: tables scroll inside cards rather than stretching dashboard grids. */
.grid > *, .card { min-width: 0; }
.tw { max-width: 100%; }
.toast { overflow-wrap: anywhere; }
</style>

const fnv=s=>{let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')};
async function sha256hex(data){if(!crypto.subtle)throw new Error('Secure context (https) required for hashing');const b=await crypto.subtle.digest('SHA-256',typeof data==='string'?new TextEncoder().encode(data):data);return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
async function pwHash(s){try{return await sha256hex(s)}catch(e){return 'f'+fnv(s)+fnv(s.split('').reverse().join(''))}}
function download(name,content,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const toCSV=rows=>rows.map(r=>r.map(v=>{v=String(v??'');if(/^[=@]/.test(v)||/^[+\-][^\d]/.test(v))v="'"+v;return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\r\n');
function parseCSV(t){const rows=[];let row=[],f='',q=false;t=t.replace(/^﻿/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true;else if(c===','){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}}if(f!==''||row.length){row.push(f);rows.push(row)}return rows.filter(r=>r.some(x=>String(x).trim()!==''))}
function qrSvg(text,cell=4){try{const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag(cell,2)}catch(e){return '<div class="muted sm">QR library unavailable offline</div>'}}

const LHDN={base(co){const u=(co.lhdn.proxyUrl||'').trim()||(CLOUD?(CFG.lhdnFunctionUrl||CFG.supabaseUrl.replace(/\/+$/,'')+'/functions/v1/lhdn'):'');return u.replace(/\/+$/,'')},

 async call(co,method,path,body,invId){const b=this.base(co);if(!b)throw Object.assign(new Error('LHDN backend is not connected. Configure it in Integrations.'),{kind:'config'});
  for(let attempt=0;attempt<5;attempt++){let res;
   try{res=await fetch(b+'/lhdn'+path,{method,headers:await this.headers(co,invId),body:body?JSON.stringify(body):undefined})}
   catch(e){if(attempt<2){await sleep(1000*2**attempt);continue}throw Object.assign(new Error('Network error — could not reach the LHDN backend.'),{kind:'transport'})}
   if(res.status===429){const ra=Math.min(+res.headers.get('Retry-After')||2**attempt*2,60);co.lhdn.incidents.unshift({at:new Date().toISOString(),type:'429',detail:'Rate limited on '+path+'; waited '+ra+'s'});co.lhdn.incidents.length=Math.min(co.lhdn.incidents.length,100);await sleep(ra*1000);continue}
   if(res.status>=500&&attempt<3){await sleep(1500*2**attempt);continue}
   const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data={raw:txt.slice(0,500)}}
   const msg=data&&(data.error?.message||data.error?.details?.[0]?.message||data.message||data.error_description||(typeof data.error==='string'?data.error:''));
   if(res.status===401||res.status===403){co.lhdn.health='auth_error';throw Object.assign(new Error(msg||'Authorization failed — check intermediary permission for this taxpayer.'),{kind:'auth',status:res.status,data})}
   if(!res.ok)throw Object.assign(new Error(msg||('LHDN returned HTTP '+res.status)),{kind:'api',status:res.status,data});

function flattenErr(e,step){if(!e)return [];const out=[];const walk=x=>{if(!x||typeof x!=='object')return;const m=x.error||x.message;if(m&&typeof m==='string')out.push({code:x.errorCode||x.code||'',message:m,path:x.propertyPath||x.target||x.propertyName||'',step:step||''});(x.innerError||x.details||[]).forEach(walk)};walk(e);return out.length?out:[{code:'',message:JSON.stringify(e).slice(0,300),path:'',step:step||''}]}

async function submitInvoice(id){const co=CO();const inv=co.invoices.find(i=>i.id===id);if(!inv)return;

  const acc=(d?.acceptedDocuments||[]).find(a=>a.invoiceCodeNumber===inv.number)||(d?.acceptedDocuments||[])[0];const rej=(d?.rejectedDocuments||[]).find(a=>a.invoiceCodeNumber===inv.number)||(d?.rejectedDocuments||[])[0];

async function pollStatus(id){for(const ms of [3000,5000,8000,13000,21000,34000]){await sleep(ms);const co=CO();const inv=co?.invoices.find(i=>i.id===id);if(!inv||inv.lhdn.status!=='Submitted')return;await refreshStatus(id,true);if(inv.lhdn.status!=='Submitted')return}}

 try{for(const co of DB.companies){if(!co._v)continue;const body=coBody(co);if(co.status==='suspended'){if(PUSHED[co.id]!==fnv(JSON.stringify(body))){toast('Suspended company data cannot be saved. Revert changes or contact support.','err');return false}continue}const h=fnv(JSON.stringify(body));if(PUSHED[co.id]===h)continue;
  const {data,error}=await SB.from('companies').update({data:body,name:co.name,tin:(co.tin||'').toUpperCase(),version:co._v+1}).eq('id',co.id).eq('version',co._v).select('version');
  if(error){toast('Cloud save failed: '+error.message+' — changes kept on this page.','err');return false}
  if(!data||!data.length){toast('Cloud save conflict. Your unsaved changes remain on this page. Export a backup from Settings before reloading.','err');return false}
  co._v=data[0].version;PUSHED[co.id]=h;await syncLinks(co)}UNSYNCED_CLOUD=DB.companies.some(c=>c._v&&PUSHED[c.id]!==fnv(JSON.stringify(coBody(c))));if(UNSYNCED_CLOUD){clearTimeout(PUSH_T);PUSH_T=setTimeout(cloudPush,700)}return !UNSYNCED_CLOUD}
 catch(e){console.error('MYR Invoice cloud save',e);toast('Cloud save failed: '+(e.message||String(e)),'err');return false}
 finally{PUSHING=false}}
async function cloudCreate(co){const body=coBody(co);const {error}=await SB.from('companies').insert({id:co.id,name:co.name,tin:(co.tin||'').toUpperCase(),plan:'Starter',data:body});if(error){toast('Could not create company: '+error.message,'err');return false}/* INSERT without RETURNING: owner membership is added by the AFTER INSERT trigger. The new row is not SELECT-visible until that trigger has run. */co.plan='Starter';co._v=1;co.status='active';PUSHED[co.id]=fnv(JSON.stringify(body));LINKS[co.id]=new Set();await syncLinks(co);return true}

function barChart(series,labels,keys,colors,h=200){const max=Math.max(1,...series.flatMap(s=>keys.map(k=>s[k])));const W=600,pad=34,bw=(W-pad)/series.length;const g=keys.length;const bwi=Math.min(26,(bw-18)/g);
 const ticks=[0,.5,1].map(t=>Math.round(max*t));
 return `<svg viewBox="0 0 ${W} ${h+28}" width="100%" role="img" aria-label="Monthly chart">${ticks.map(t=>{const y=h-(t/max)*(h-10);return `<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#EEF2F7"/><text x="${pad-6}" y="${y+4}" font-size="10" fill="#94A3B8" text-anchor="end">${t>=100000?(t/100000).toFixed(1).replace(/\.0$/,'')+'k':Math.round(t/100)}</text>`}).join('')}${series.map((s,i)=>keys.map((k,j)=>{const v=s[k];const bh=(v/max)*(h-10);const x=pad+i*bw+(bw-g*bwi-(g-1)*4)/2+j*(bwi+4);return `<rect class="chart-bar" x="${x}" y="${h-bh}" width="${bwi}" height="${Math.max(bh,0)}" rx="5" fill="${colors[j]}"><title>${esc(labels[i])}: ${money(v)}</title></rect>`}).join('')+`<text x="${pad+i*bw+bw/2}" y="${h+18}" font-size="11" fill="#64748B" text-anchor="middle">${esc(labels[i])}</text>`).join('')}</svg>`}

async function markReady(id){const co=CO();if(!can('Edit Draft'))return toast('Not allowed to update invoices.','err');const inv=co.invoices.find(i=>i.id===id);const r=runCheck(inv,co);if(r.errors.length){toast(r.errors.length+' compliance issue(s) — opening editor.','err');return go('#/app/invoices/edit/'+id)}inv.appStatus=co.approvalRequired&&!can('Approve')?'Approval Pending':'Ready';tl(inv,'Status → '+inv.appStatus);audit(co,'invoice.ready',inv.number);save();if(CLOUD){clearTimeout(PUSH_T);PUSH_T=null;if(!(await cloudPush()))return toast('Status not yet saved in cloud. Keep this tab open and retry save.','err')}toast(inv.appStatus==='Ready'?'Marked ready':'Sent for approval');rerender()}
async function approveInv(id){const co=CO();const inv=co.invoices.find(i=>i.id===id);if(!can('Approve'))return;if(inv.createdBy===DB.session&&co.members.length>1)toast('Note: you are approving your own document.','warn');inv.appStatus='Ready';tl(inv,'Approved by '+DB.session);audit(co,'invoice.approve',inv.number);save();if(CLOUD){clearTimeout(PUSH_T);PUSH_T=null;if(!(await cloudPush()))return toast('Approval not confirmed saved in cloud. Keep this tab open and retry save.','err')}toast('Approved — eligible for submission');rerender()}

function dupInvoice(id){const co=CO();const s=co.invoices.find(i=>i.id===id);const n=blankInvoice(co,s.docType);Object.assign(n,{customerId:s.customerId,items:clone(s.items).map(x=>({...x,id:uuid()})),currency:s.currency,fxRate:s.fxRate,payTerms:s.payTerms,notes:s.notes,consolidated:s.consolidated});PREFILL=n;go('#/app/invoices/new')}

function cancelModal(id){modal('Cancel e-Invoice',`<div class="note w mb">Cancellation is only possible within 72 hours of validation and is recorded by LHDN. The buyer is notified by LHDN.</div><div class="fg"><label class="f">Reason (required, max 300 characters)</label><textarea id="cx-r" maxlength="300"></textarea></div>`,`<button class="btn" onclick="closeModal()">Keep</button><button class="btn d" onclick="doCancel('${id}')">Cancel e-Invoice</button>`)}
async function doCancel(id){const reason=val('cx-r');if(!reason)return toast('Enter a reason.','err');const co=CO();const inv=co.invoices.find(i=>i.id===id);if(hoursLeft(inv)<=0)return toast('The cancellation window has closed.','err');closeModal();
 try{await LHDN.call(co,'PUT','/api/v1.0/documents/state/'+encodeURIComponent(inv.lhdn.uuid)+'/state',{status:'cancelled',reason},inv.id);inv.lhdn.status='Cancelled';tl(inv,'Cancelled at LHDN. Reason: '+reason);audit(co,'invoice.cancel',inv.number+' · '+reason);toast('Cancelled at LHDN')}catch(e){tl(inv,'Cancellation failed: '+e.message);toast(e.message,'err')}save();rerender()}
function adjModal(id,type='02'){const co=CO();const valid=co.invoices.filter(i=>['01','11'].includes(i.docType)&&i.lhdn.status==='Valid');
 modal('Credit / debit / refund note',`<div class="fg"><label class="f">Type</label><select id="aj-t">${opt([['02','Credit Note — reduce amount'],['03','Debit Note — increase amount'],['04','Refund Note — money returned']],type)}</select></div><div class="fg"><label class="f">Original validated document</label><select id="aj-o">${valid.length?opt(valid.map(i=>[i.id,i.number+' · '+(custOf(co,i)?.name||'')+' · '+money(calc(i).total)]),id):'<option value="">No validated invoices yet</option>'}</select></div><div class="fg"><label class="f">Reason</label><input id="aj-r" placeholder="e.g. Returned 2 units"></div><p class="muted sm">A draft is created with the original lines. Adjust quantities/amounts to the adjustment value, then check and submit.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" ${valid.length?'':'disabled'} onclick="doAdj()">Create draft</button>`)}
function doAdj(){const co=CO();const o=co.invoices.find(i=>i.id===val('aj-o'));if(!o)return;let t=val('aj-t');if(isSelfBilled(o))t=String(+t+10);const n=blankInvoice(co,t);Object.assign(n,{customerId:o.customerId,refInvoiceId:o.id,currency:o.currency,fxRate:o.fxRate,items:clone(o.items).map(x=>({...x,id:uuid()})),notes:val('aj-r')?('Reason: '+val('aj-r')):'',payTerms:''});n.number=(t==='02'||t==='12'?'CN-':t==='03'||t==='13'?'DN-':'RN-')+o.number;closeModal();PREFILL=n;go('#/app/invoices/new')}
function payModal(id){if(!can('Edit Draft'))return toast('Your role cannot record payments.','err');const inv=CO().invoices.find(i=>i.id===id);if(!inv||inv.lhdn.status==='Cancelled')return toast('Cannot record payment for this invoice.','err');modal('Record payment — '+esc(inv.number),`<div class="grid g2">${field('py-a','Amount ('+inv.currency+')',(balance(inv)/100).toFixed(2),'text','inputmode="decimal"')}${field('py-d','Payment date',todayStr(),'date','max="'+todayStr()+'"')}<div class="fg"><label class="f">Method</label><select id="py-m">${opt(['Bank transfer','FPX','DuitNow','DuitNow QR','Card','Cash','Cheque'].map(x=>[x,x]))}</select></div>${field('py-r','Reference','','text','placeholder="Bank ref / receipt no."')}</div><p class="muted sm">Record only payments you have confirmed in your bank or gateway. A displayed QR does not prove payment.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="savePay('${id}')">Save payment</button>`)}
let PAYMENT_SAVING=false;
async function savePay(id){if(PAYMENT_SAVING)return;if(!can('Edit Draft'))return toast('Your role cannot record payments.','err');const co=CO(),inv=co?.invoices.find(i=>i.id===id);if(!inv||inv.lhdn.status==='Cancelled')return toast('Cannot record payment on this invoice.','err');const raw=val('py-a').trim(),a=toSen(raw),date=val('py-d')||todayStr();if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(a)||a<=0)return toast('Enter a positive amount with up to 2 decimals.','err');if(a>balance(inv))return toast('Amount exceeds the balance of '+money(balance(inv),inv.currency),'err');if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>todayStr())return toast('Payment date must be today or earlier.','err');PAYMENT_SAVING=true;try{inv.payments.push({id:uuid(),date,amount:a,method:val('py-m'),ref:val('py-r'),by:DB.session,at:new Date().toISOString()});tl(inv,'Payment recorded '+money(a,inv.currency));audit(co,'payment.record',inv.number+' '+money(a,inv.currency));save();if(CLOUD){clearTimeout(PUSH_T);PUSH_T=null;if(!(await cloudPush())){closeModal();toast('Payment is NOT confirmed saved in the cloud. Keep this tab open and use Retry save. Do not enter it twice.','err');rerender();return}}closeModal();toast('Payment recorded and saved');rerender()}finally{PAYMENT_SAVING=false}}
function remind(id){if(!can('Edit Draft'))return toast('Your role cannot prepare payment reminders.','err');const co=CO();const inv=co.invoices.find(i=>i.id===id);const c=custOf(co,inv)||{};if(!c.email)return toast('Customer has no email address.','err');if(balance(inv)<=0)return toast('This invoice has no outstanding balance.','warn');const sub=`Payment reminder: ${inv.number} from ${co.name}`;const body=`Dear ${c.name},\n\nThis is a friendly reminder that invoice ${inv.number} dated ${fmtDate(inv.issueDate)} has an outstanding balance of ${money(balance(inv),inv.currency)}${inv.dueDate?`, due on ${fmtDate(inv.dueDate)}`:''}.\n\nIf you have already paid, please ignore this message or reply with the payment reference.\n\nThank you,\n${co.name}\n${co.phone||''}`;tl(inv,'Email reminder draft requested for '+c.email+' (delivery not verified)');save();toast('An email draft will open; sending is not confirmed.','warn');location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}
function shareInv(id){const co=CO();const inv=co.invoices.find(i=>i.id===id);if(!inv.share||new Date(inv.share.exp)<new Date())inv.share={token:rid(32),exp:addDays(todayStr(),30)};save();const url=location.origin+location.pathname+'#/v/'+inv.share.token;modal('Share with customer',`<p class="muted sm">A private link scoped to this single document. Expires ${fmtDate(inv.share.exp)}.</p><div class="row nw"><input id="sh-u" value="${esc(url)}" readonly><button class="btn" onclick="navigator.clipboard?.writeText(val('sh-u'));toast('Link copied')">Copy</button></div><div class="mt" style="text-align:center" class="qrwrap">${qrSvg(url,4)}</div><button class="btn sm d mt" onclick="CO().invoices.find(i=>i.id==='${id}').share=null;save();closeModal();toast('Link revoked')">Revoke link</button>`)}

 const head=ph('E-Invoice Centre','Official submissions, validation tracking, error rescue and cancellation windows.',`<a class="btn" href="#/app/integrations">${ic('plug',16)}Connection</a>`)+tabs('#/app/einvoice',[['','Overview'],['rescue','Invoice Rescue Centre'],['windows','Cancellation windows'],['log','Submission log']],t);
 if(t==='rescue')return head+vRescue(co);

 if(t==='log'){const rows=inv.flatMap(i=>i.lhdn.attempts.map(a=>({...a,inv:i}))).sort((a,b)=>b.at.localeCompare(a.at));return head+`<div class="card">${rows.length?`<div class="tw"><table class="t"><thead><tr><th>Time</th><th>Document</th><th>Env</th><th>Result</th><th>Submission UID</th><th>Detail</th></tr></thead><tbody>${rows.map(a=>`<tr><td class="nowrap">${fmtDT(a.at)}</td><td><a href="#/app/invoices/view/${a.inv.id}">${esc(a.inv.number)}</a></td><td>${esc(a.env)}</td><td>${B(a.result==='accepted'?'Submitted':a.result==='rejected'?'Invalid':a.result==='queued'?'Submission Queued':'Rejected')} <span class="muted sm">${esc(a.result)}</span></td><td class="mono">${esc(a.submissionUid||'—')}</td><td class="sm muted">${esc(a.detail||'')}</td></tr>`).join('')}</tbody></table></div>`:empty('file','No submission attempts','Attempts and their official results are logged here.')}</div>`}
 const c=s=>inv.filter(i=>i.lhdn.status===s).length;const ready=inv.filter(i=>['Ready','Submission Queued'].includes(i.appStatus)&&!locked(i)&&i.lhdn.status!=='Invalid');
 return head+`<div class="grid g5">${[['Not submitted',c('Not Submitted')],['Processing',c('Submitted')],['Valid',c('Valid')],['Invalid',c('Invalid')],['Cancelled',c('Cancelled')]].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
 ${!LHDN.base(co)?`<div class="note w mt"><b>LHDN backend not connected.</b> Documents can be prepared, checked and queued, but nothing is sent to MyInvois until a secure backend is configured. <a href="#/app/integrations">Set up connection</a></div>`:''}
 <div class="card mt"><div class="ch"><h3>Ready to submit</h3><span class="muted sm">${ready.length} document(s)</span></div>${ready.length?`<div class="tw"><table class="t"><thead><tr><th>Number</th><th>Customer</th><th class="r">Amount</th><th>Check</th><th></th></tr></thead><tbody>${ready.map(i=>{const r=runCheck(i,co);return `<tr><td class="b">${esc(i.number)}</td><td>${esc(custOf(co,i)?.name||'')}</td><td class="r num">${money(calc(i).total,i.currency)}</td><td>${r.errors.length?`<span class="badge b-err">${r.errors.length} error(s)</span>`:`<span class="badge b-ok">Passed</span>`}</td><td class="r">${r.errors.length?`<a class="btn sm" href="#/app/invoices/edit/${i.id}">Fix</a>`:can('Submit')?`<button class="btn sm p" onclick="confirmSubmit('${i.id}')">Submit</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:`<p class="muted pad">No documents waiting.</p>`}</div>
 <div class="card mt"><div class="ch"><h3>Processing at LHDN</h3><button class="btn sm" onclick="refreshAll()">${ic('refresh',14)}Refresh all</button></div>${invTable(inv.filter(i=>i.lhdn.status==='Submitted'),co,true)}</div>`}
async function refreshAll(){const co=CO();const l=co.invoices.filter(i=>i.lhdn.status==='Submitted');if(!l.length)return toast('Nothing processing.');for(const i of l){await refreshStatus(i.id,true);await sleep(400)}toast('Statuses refreshed')}
function vRescue(co){const list=rescueList(co);const items=list.map(i=>{const r=runCheck(i,co);const kind=i.lhdn.status==='Invalid'?'Invalid at LHDN':i.lhdn.lastError?({transport:'Connection failure',auth:'Authorization failure',rate:'Rate limited',api:'Submission error'}[i.lhdn.lastError.kind]||'Failed'):'Blocked by compliance check';const errs=i.lhdn.status==='Invalid'?i.lhdn.errors.map(e=>({...explainErr(e),raw:e})):r.errors.map(e=>({title:e.problem,reason:e.reason,fix:e.action,field:e.field}));return {i,kind,errs,r}});
 const cats={};items.forEach(x=>x.errs.forEach(e=>cats[e.title]=(cats[e.title]||0)+1));const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);const custs=new Set(items.map(x=>x.i.customerId)).size;
 return `<div class="grid g4">${[['Invalid at LHDN',items.filter(x=>x.kind==='Invalid at LHDN').length],['Failed submissions',items.filter(x=>/failure|limited|error/i.test(x.kind)).length],['Blocked by checks',items.filter(x=>x.kind==='Blocked by compliance check').length],['Affected customers',custs]].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>
 ${top.length?`<div class="card pad mt"><h3 class="mb">Most common problems</h3>${top.map(([t,n])=>`<div class="row sb sm" style="padding:6px 0"><span>${esc(t)}</span><span class="b">${n}</span></div><div class="meter"><i style="width:${n/top[0][1]*100}%"></i></div>`).join('')}</div>`:''}
 <div class="mt">${items.length?items.map(x=>`<div class="card pad mb"><div class="row sb"><div><b>${esc(x.i.number)}</b> <span class="muted">· ${esc(custOf(co,x.i)?.name||'No customer')} · ${money(calc(x.i).total,x.i.currency)}</span></div><div class="row"><span class="badge ${x.kind==='Invalid at LHDN'?'b-err':'b-warn'}">${esc(x.kind)}</span></div></div>
  <div class="mt8">${x.errs.slice(0,5).map(e=>`<div class="iss"><b>${esc(e.title)}</b><div class="m">${esc(e.reason||'')}</div><div class="a">→ ${esc(e.fix)}</div>${e.raw?`<div class="muted mono mt8">${esc(e.raw.message)}</div>`:''}</div>`).join('')}${x.errs.length>5?`<p class="muted sm">+${x.errs.length-5} more</p>`:''}</div>
  <div class="row mt8"><a class="btn p sm" href="#/app/invoices/edit/${x.i.id}">${ic('buoy',14)}Fix now</a>${x.r.errors.length===0&&can('Submit')?`<button class="btn sm" onclick="confirmSubmit('${x.i.id}')">Retry submission</button>`:`<span class="muted sm">Retry available after local check passes</span>`}<a class="btn g sm" href="#/app/invoices/view/${x.i.id}">History</a></div></div>`).join(''):`<div class="card">${empty('buoy','Nothing to rescue','Invalid documents, failed submissions and documents blocked by checks will appear here with guided fixes.')}</div>`}</div>`}

 const head=ph('Customers','Buyer records with TIN, identity and address details.',t==='requests'?`<button class="btn p" onclick="qrNew()">${ic('qr',16)}New QR request</button>`:`<button class="btn" onclick="exportCust()">${ic('dl',16)}Export</button><a class="btn" href="#/app/import">${ic('upload',16)}Import</a><button class="btn p" onclick="custModal()">${ic('plus',16)}Add customer</button>`)+tabs('#/app/customers',[['','Customers'],['requests','QR e-Invoice requests'+(co.requests.filter(r=>r.status==='Received').length?' ('+co.requests.filter(r=>r.status==='Received').length+')':'')]],t);

function custTable(co){const q=CQ.q.toLowerCase();const l=co.customers.filter(c=>{if(CQ.f==='archived'?!c.archived:c.archived)return false;if(q&&!(`${c.name} ${c.tin} ${c.email} ${c.idValue}`.toLowerCase().includes(q)))return false;const e=custErrors(c).length;if(CQ.f==='issues'&&!e)return false;if(CQ.f==='ready'&&e)return false;return true});

 const dup=co.customers.find(c=>c.id!==id&&!c.system&&((d.tin&&c.tin===d.tin&&c.idValue===d.idValue&&!SPECIAL_TIN[d.tin])||c.name.toLowerCase()===d.name.toLowerCase()));if(dup&&!$('#cm-err').dataset.ok){$('#cm-err').dataset.ok='1';$('#cm-err').innerHTML=`<div class="note w mb">Possible duplicate of <b>${esc(dup.name)}</b>. Click Save again to keep both.</div>`;return}

 o.textContent='Checking with LHDN…';try{await LHDN.call(co,'GET',`/api/v1.0/taxpayer/validate/${encodeURIComponent(tin)}?idType=${encodeURIComponent(t)}&idValue=${encodeURIComponent(v)}`);o.innerHTML='<span style="color:var(--ok)">✓ TIN and ID matched by LHDN.</span>'}catch(e){o.innerHTML=`<span style="color:var(--err)">${e.status===404||e.status===400?'Not matched by LHDN — check TIN and ID.':esc(e.message)}</span>`}}

function vRequests(co){const l=co.requests.slice().sort((a,b)=>b.createdAt.localeCompare(a.createdAt));const pl=planOf(co);const lim=pl.qr==='Limited'?20:Infinity;
 return `<div class="note mb">Buyers scan the QR, enter their own e-Invoice details on their phone, and you approve them into a customer record with a prefilled invoice. ${lim<Infinity?`Your plan allows ${lim} open requests.`:''}</div><div class="card">${l.length?`<div class="tw"><table class="t"><thead><tr><th>Request</th><th>Created</th><th>Expires</th><th>Status</th><th>Buyer</th><th></th></tr></thead><tbody>${l.map(r=>{const s=reqStatus(r);return `<tr><td><b>${esc(r.label)}</b><div class="muted sm">Receipt ${esc(r.receipt||'—')}</div></td><td>${fmtDate(r.createdAt)}</td><td>${fmtDate(r.expiresAt)}</td><td>${B(s)}</td><td>${esc(r.data?.name||'—')}</td><td class="r nowrap">${s==='Received'?`<button class="btn sm p" onclick="qrReview('${r.id}')">Review</button>`:''}${['Open','Expired'].includes(s)?`<button class="btn sm" onclick="qrShow('${r.id}')">${ic('qr',14)}QR</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:empty('qr','No QR requests yet','Create a request per sale or a counter QR for walk-in buyers.',`<button class="btn p" onclick="qrNew()">New QR request</button>`)}</div>`}

async function buyerSubmit(token){
 const d={name:val('by-name'),tin:val('by-tin').toUpperCase(),idType:val('by-idt'),idValue:val('by-idv'),email:val('by-email'),phone:val('by-phone'),addr:{line:val('by-line'),city:val('by-city'),postcode:val('by-post'),state:val('by-state'),country:(val('by-country')||'MYS').toUpperCase()},receipt:val('by-rcpt'),at:new Date().toISOString()};
 const errs=partyIssues(d,'buyer').filter(x=>x.lvl==='e');if(!d.email||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email))errs.push({problem:'A valid email is required'});if(!chk('by-ok'))errs.push({problem:'Please give consent to share your details'});
 if(errs.length){$('#by-err').innerHTML=`<div class="note e mb">${errs.map(e=>'• '+esc(e.problem)).join('<br>')}</div>`;window.scrollTo({top:0,behavior:'smooth'});return}
 const btn=$('#by-btn');if(btn){btn.disabled=true;btn.textContent='Sending…'}
 if(CLOUD){const {error}=await SB.rpc('submit_public_link',{p_token:token,p_payload:d});if(error){if(btn){btn.disabled=false;btn.textContent='Submit details'}$('#by-err').innerHTML=`<div class="note e mb">${esc(error.message)}</div>`;return}}
 else{let co,r;for(const c of DB.companies){const x=c.requests.find(q=>q.token===token);if(x){co=c;r=x;break}}if(!r)return;if((r.submits||0)>=10)return toast('Too many submissions for this request. Ask the seller for a new QR.','err');r.data=d;r.status='Received';r.submits=(r.submits||0)+1;audit(co,'qr.received',r.label+' · '+d.name);save()}
 $('#app').innerHTML=`<div class="mobile-page"><div class="box"><div class="card">${empty('check','Thank you!',`Your details were sent to ${esc(PUB.coName)}. They will issue your e-Invoice and it will be emailed to ${esc(d.email)}.`)}</div></div></div>`}

 <div class="row"><button class="btn p" onclick="saveLhdn()">Save</button><button class="btn" onclick="testConn()">${ic('refresh',16)}Test connection</button><span class="muted sm">Taxpayer TIN (on behalf of): <b class="mono">${esc(co.tin||'—')}</b></span></div>
 ${L2.env==='production'?`<div class="note w mt"><b>Production:</b> submissions create official tax documents. Confirm intermediary authorization, credentials and document versions before going live.</div>`:''}
 <div class="grid g4 mt">${[['Last success',fmtDT(L2.lastOk)],['Processing',co.invoices.filter(i=>i.lhdn.status==='Submitted').length],['Queued',co.invoices.filter(i=>i.appStatus==='Submission Queued').length],['Rate-limit events',L2.incidents.filter(x=>x.type==='429').length]].map(([l,v])=>`<div class="cbox"><div class="muted sm">${l}</div><b>${v}</b></div>`).join('')}</div>
 <details class="mt"><summary class="b" style="cursor:pointer">Backend contract (for developers)</summary><div class="mt8 sm"><p>The browser calls your backend at <code>{URL}/lhdn/…</code> with headers <code>X-MYR-Environment</code>, <code>X-MYR-OnBehalfOf</code> (taxpayer TIN) and <code>X-MYR-Company</code>. The backend authenticates as intermediary (<a href="${L.inter}" target="_blank" rel="noopener">login as intermediary</a>), caches tokens, adds <code>onbehalfof</code>, verifies the user's company permissions and forwards to MyInvois unchanged:</p><pre class="code">GET  /health
POST /lhdn/api/v1.0/documentsubmissions
GET  /lhdn/api/v1.0/documentsubmissions/{submissionUid}
GET  /lhdn/api/v1.0/documents/{uuid}/details
PUT  /lhdn/api/v1.0/documents/state/{uuid}/state
GET  /lhdn/api/v1.0/taxpayer/validate/{tin}?idType=&idValue=</pre><p class="mt8">Return LHDN status codes as-is (including 429 with <code>Retry-After</code>). Documents are built as UBL 2.1 JSON, version 1.0 (unsigned). Signed versions (1.1) require server-side signing — see <a href="${L.sig}" target="_blank" rel="noopener">signature guide</a> and <a href="${L.practices}" target="_blank" rel="noopener">integration practices</a>.</p></div></details>
 ${L2.incidents.length?`<details class="mt"><summary class="b" style="cursor:pointer">Recent incidents (${L2.incidents.length})</summary>${L2.incidents.slice(0,20).map(x=>`<div class="sm" style="padding:5px 0;border-bottom:1px solid var(--line)">${fmtDT(x.at)} · <b>${esc(x.type)}</b> · ${esc(x.detail)}</div>`).join('')}</details>`:''}</div></div>
 <div class="grid g3 mt">${[['upload','Excel / CSV import','Customers import with mapping and compliance scan.','Live','#/app/import'],['card','Payment gateway (FPX, DuitNow, cards)','Verified payment links and automatic reconciliation via a licensed Malaysian gateway.','Planned'],['plug','REST API & webhooks','Scoped API keys, signed webhooks for validation events. Business plan.','Planned'],['globe','Shopify','Create drafts from orders.','Planned'],['globe','WooCommerce','Create drafts from orders.','Planned'],['receipt','POS connectors','Consolidated and buyer-requested e-Invoices from POS sales.','Planned'],['sparkle','AI document extraction','Upload a receipt and review extracted fields before creating a draft. Optional, with disclosure.','Planned'],['users','Accounting software import','Import customers and items from existing systems.','Planned'],['bolt','Low-code automation','Zapier / Make style triggers.','Planned']].map(([i,t,d,s,h])=>`<div class="card feat"><div class="row sb"><div class="fi">${ic(i,20)}</div>${B(s)}</div><h3>${t}</h3><p>${d}</p>${h?`<a class="btn sm mt" href="${h}">Open</a>`:''}</div>`).join('')}</div>`}
function saveLhdn(){if(!can('Manage Settings'))return toast('Not allowed.','err');const co=CO();if(co.demo)return toast('Demo workspace cannot connect to real LHDN.','warn');const url=val('lh-url');if(url&&!/^https:\/\//.test(url)&&!/^http:\/\/localhost/.test(url))return toast('Backend URL must use https://','err');const env=val('lh-env');const go2=()=>{co.lhdn.env=env;co.lhdn.proxyUrl=url;if(!url&&!CLOUD)co.lhdn.health='not_connected';audit(co,'lhdn.config',env+' · '+(url||'none'));save();toast('Connection settings saved');rerender()};if(env==='production'&&co.lhdn.env!=='production')confirmBox('Switch to production?','Documents submitted in production are official tax documents.','Switch',go2,true);else go2()}
async function testConn(){const co=CO();if(co.demo)return toast('Demo workspace: LHDN connection is intentionally disabled.','warn');const b=LHDN.base(co);if(!b)return toast('Enter and save a backend URL first.','warn');try{const r=await fetch(b+'/health',{headers:await LHDN.headers(co)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error('HTTP '+r.status);co.lhdn.health=d.authorized===true?'connected':d.authorized===false?'auth_error':'not_connected';if(d.authorized===true)co.lhdn.lastOk=new Date().toISOString();toast(d.authorized===false?'Backend reachable, but LHDN login failed: '+(d.message||'taxpayer has not authorized MYR Invoice'):d.authorized!==true?'Backend reachable, but LHDN is not connected yet: '+(d.message||'Configure MyInvois sandbox credentials'):'Connected to LHDN '+(d.environment||co.lhdn.env),d.authorized===true?'ok':'warn')}catch(e){co.lhdn.health='not_connected';toast('Could not reach backend: '+e.message,'err')}save();rerender()}

function vBilling(){const co=CO();if(!can('Access Billing'))return ph('Billing','')+`<div class="card">${empty('lock','Owner access required','Only the company owner can view billing.')}</div>`;const pl=planOf(co);const used=usageNow(co);
 return ph('Billing','Plan, usage and billing history.')+`<div class="grid g3"><div class="card kpi"><div class="l">Current plan</div><div class="v">${esc(pl.id)} · RM${pl.price}</div><div class="s">per month</div></div><div class="card kpi"><div class="l">Documents this month</div><div class="v">${used.toLocaleString()} / ${pl.docs.toLocaleString()}</div><div class="meter mt8"><i style="width:${Math.min(100,used/pl.docs*100)}%;${used/pl.docs>.9?'background:#DC2626':''}"></i></div></div><div class="card kpi"><div class="l">Seats</div><div class="v">${co.members.length} / ${pl.users}</div></div></div>
 <div class="note mt"><b>How usage is counted:</b> one document = one e-Invoice accepted by LHDN for processing. Local compliance checks, drafts, queued items and failed connection attempts are not counted. Resubmitting a document that LHDN marked invalid counts as a new submission.</div>
 <div class="grid g3 mt">${PLANS.map(p=>`<div class="card price ${p.id===pl.id?'hl':''}"><h3>${p.id}</h3><div class="amt">RM${p.price}<span class="muted" style="font-size:14px">/mo</span></div><ul><li>${ic('check',16)}${p.docs.toLocaleString()} documents</li><li>${ic('check',16)}${p.users} users</li><li class="${p.bulk?'':'no'}">${ic(p.bulk?'check':'x',16)}Bulk CSV</li><li class="${p.approval?'':'no'}">${ic(p.approval?'check':'x',16)}Approval workflow</li><li class="${p.api?'':'no'}">${ic(p.api?'check':'x',16)}API / webhooks</li></ul>${p.id===pl.id?'<button class="btn" disabled>Current plan</button>':`<button class="btn p" onclick="setPlan('${p.id}')">${p.price>pl.price?'Upgrade':'Downgrade'}</button>`}</div>`).join('')}</div>
 <div class="card mt"><div class="ch"><h3>Billing history</h3></div>${empty('receipt','No billing records','Subscription payments appear here once the payment gateway is connected. No charges have been made.')}</div>`}
function setPlan(id){const co=CO();const p=PLANS.find(x=>x.id===id);if(CLOUD)return modal('Change plan',`<p>Plan changes are processed by MYR Invoice billing. Online subscription payment is not connected yet.</p><p class="muted">Email <a href="mailto:${esc(CFG.supportEmail)}?subject=${encodeURIComponent('Plan change to '+id+' — '+co.name)}">${esc(CFG.supportEmail)}</a> and our team will update your plan.</p>`,`<button class="btn p" onclick="closeModal()">OK</button>`);if(co.members.length>p.users)return toast('Remove members first — '+id+' allows '+p.users+' user(s).','err');confirmBox('Change plan to '+id+'?',`RM${p.price}/month. In local mode no payment is taken; in production this goes through the payment gateway.`,'Change plan',()=>{co.plan=id;if(!p.approval)co.approvalRequired=false;audit(co,'billing.plan',id);save();toast('Plan changed to '+id);rerender()})}

 return ph('Settings','Company profile, numbering, branding and data.')+(iss.length?`<div class="note e mb"><b>Company profile incomplete:</b> ${iss.map(x=>esc(x.problem)).join(' · ')}</div>`:'')+
 `<div class="grid g2" style="align-items:start"><div class="card pad"><h3 class="mb">Company profile (supplier details)</h3><div class="grid g2"><div class="spanall">${field('st-name','Registered name',co.name,'text',dis)}</div>${field('st-tin','TIN',co.tin,'text',dis+' style="text-transform:uppercase"')}${field('st-brn','BRN (12-digit)',co.brn,'text',dis)}${field('st-sst','SST no. (or NA)',co.sst||'NA','text',dis)}${field('st-ttx','Tourism tax no. (or NA)',co.ttx||'NA','text',dis)}${field('st-msic','MSIC code',co.msic,'text',dis+' maxlength="5"')}${field('st-msicd','Business activity',co.msicDesc,'text',dis)}${field('st-email','Email',co.email,'email',dis)}${field('st-phone','Phone',co.phone,'tel',dis)}<div class="spanall">${field('st-line','Address line',co.addr.line,'text',dis)}</div>${field('st-city','City',co.addr.city,'text',dis)}${field('st-post','Postcode',co.addr.postcode,'text',dis)}<div class="fg"><label class="f">State</label><select id="st-state" ${dis}>${opt(STATES,co.addr.state)}</select></div></div><button class="btn p" onclick="saveSettings()" ${dis}>Save profile</button></div>
 <div class="grid"><div class="card pad"><h3 class="mb">Invoice numbering</h3><div class="grid g2">${field('st-pre','Prefix',co.prefix,'text',dis)}${field('st-next','Next number',co.nextNo,'number',dis+' min="1"')}</div><p class="muted sm">Next invoice: <b>${esc(co.prefix+co.nextNo)}</b></p><button class="btn" onclick="CO().prefix=val('st-pre');CO().nextNo=Math.max(1,+val('st-next')||1);save();toast('Numbering saved');rerender()" ${dis}>Save numbering</button></div>
 <div class="card pad"><h3 class="mb">Branding</h3><div class="row">${co.logo?`<img src="${co.logo}" alt="Logo" style="max-height:48px;max-width:160px;border:1px solid var(--line);border-radius:8px;padding:4px">`:'<span class="muted sm">No logo</span>'}<label class="btn sm" for="st-logo">Upload logo</label><input type="file" id="st-logo" accept="image/png,image/jpeg,image/svg+xml" style="display:none" onchange="logoFile(this.files[0])" ${dis}>${co.logo?`<button class="btn sm g d" onclick="CO().logo='';save();rerender()">Remove</button>`:''}</div><p class="muted sm mt8">PNG/JPG/SVG under 300 KB.</p></div>
 <div class="card pad"><h3 class="mb">Notifications</h3><label class="chk"><input type="checkbox" ${co.digest?'checked':''} onchange="CO().digest=this.checked;save();toast('Saved')"> Daily smart digest email to owner (e.g. valid, invalid, unpaid and action counts)</label><p class="muted sm mt8">Sent only when enabled and email delivery is configured on the server.</p></div>
 <div class="card pad"><h3 class="mb">Data</h3><div class="row"><button class="btn sm" onclick="exportData()">${ic('dl',14)}Export company data (JSON)</button><label class="btn sm" for="st-imp">Restore from JSON</label><input type="file" id="st-imp" accept=".json" style="display:none" onchange="importData(this.files[0])"></div><p class="muted sm mt8">Use export to back up local data or to migrate into the production database.</p>${role()==='Owner'?`<button class="btn sm d mt" onclick="confirmBox('Delete this company?','All data for ${esc(co.name).replace(/'/g,'')} will be removed. Export first. Official LHDN records are not affected.','Delete',delCompany,true)">Delete company</button>`:''}</div></div></div>`}
function saveSettings(){const co=CO();Object.assign(co,{name:val('st-name'),tin:val('st-tin').toUpperCase(),brn:val('st-brn'),sst:val('st-sst')||'NA',ttx:val('st-ttx')||'NA',msic:val('st-msic'),msicDesc:val('st-msicd'),email:val('st-email'),phone:val('st-phone')});Object.assign(co.addr,{line:val('st-line'),city:val('st-city'),postcode:val('st-post'),state:val('st-state')});audit(co,'settings.company','profile updated');save();toast('Company profile saved');rerender()}
function logoFile(f){if(!f)return;if(f.size>300*1024)return toast('Logo must be under 300 KB.','err');if(!/^image\/(png|jpeg|svg\+xml)$/.test(f.type))return toast('Use PNG, JPG or SVG.','err');const r=new FileReader();r.onload=e=>{CO().logo=e.target.result;save();rerender()};r.readAsDataURL(f)}
function exportData(){const co=CO();download(co.name.replace(/[^a-z0-9]+/gi,'-')+'-myrinvoice-'+todayStr()+'.json',JSON.stringify(co,null,2),'application/json');audit(co,'export.data','full company JSON');save()}
function importData(f){if(!f)return;const r=new FileReader();r.onload=async e=>{try{const d=JSON.parse(e.target.result);if(!d.id||!Array.isArray(d.invoices)||!Array.isArray(d.customers))throw 0;if(CLOUD){const co=Object.assign(newCompany({}),d,{id:uuid(),members:[{email:DB.session,name:user().name,role:'Owner',status:'active',at:new Date().toISOString()}]});co.invoices.forEach(i=>{i.lhdn={status:'Not Submitted',submissionUid:'',uuid:'',longId:'',validatedAt:'',errors:[],attempts:[]};delete i.share});if(!(await cloudCreate(co)))return;DB.companies.push(co);DB.currentId=co.id;toast('Imported as a new company (LHDN statuses are not copied)');return go('#/app/dashboard')}if(!d.members.some(m=>m.email===DB.session))d.members.push({email:DB.session,name:user().name,role:'Owner',status:'active',at:new Date().toISOString()});const i=DB.companies.findIndex(c=>c.id===d.id);if(i>=0)DB.companies[i]=d;else DB.companies.push(d);DB.currentId=d.id;save();toast('Company restored');go('#/app/dashboard')}catch(err){toast('Not a valid MYR Invoice export.','err')}};r.readAsText(f)}
async function delCompany(){const co=CO();if(CLOUD){const {error}=await SB.from('companies').delete().eq('id',co.id);if(error)return toast(error.message,'err')}DB.companies=DB.companies.filter(c=>c.id!==co.id);DB.currentId=null;save();go(myCos().length?'#/app/dashboard':'#/app/onboarding')}

function adminLocal(){const adm=e=>CFG.adminEmails.length?CFG.adminEmails.map(x=>x.toLowerCase()).includes(e):DB.users[0]?.email===e;
 const rows=DB.companies.map(c=>{const st=s=>c.invoices.filter(i=>i.lhdn.status===s).length;return {id:c.id,name:c.name,tin:c.tin,plan:c.plan,status:c.status||'active',created_at:c.createdAt,owner:(c.members.find(m=>m.role==='Owner')||{}).email,members:c.members.length,invoices:c.invoices.length,valid:st('Valid'),invalid:st('Invalid'),processing:st('Submitted'),docs_month:usageNow(c),last_ok:c.lhdn.lastOk,rate_limits:c.lhdn.incidents.filter(x=>x.type==='429').length}});

 const k=(l,v,s)=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;
 const head=(title,sub)=>`<div class="ph"><div><h1>${title}</h1><p>${sub}</p></div></div>`;
 if(t==='businesses'){return adminShell(t,head('Businesses','Manage account status and plans. Invoice contents are not visible to platform admins.')+`<div class="card"><div class="ch"><input placeholder="Search company, owner or TIN" style="max-width:340px" oninput="$$('#admt tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><span class="muted sm">${R.length} businesses</span></div>${R.length?`<div class="tw"><table class="t" id="admt"><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th class="r">Users</th><th class="r">Docs</th><th class="r">Valid</th><th class="r">Invalid</th><th class="r">Processing</th><th>Usage (month)</th><th>Last LHDN success</th><th></th></tr></thead><tbody>${R.map(r=>`<tr><td style="min-width:220px"><b>${esc(r.name)}</b><div class="muted sm">${esc(r.owner||'—')} · ${esc(r.tin||'no TIN')}</div><div class="muted sm">Since ${fmtDate(r.created_at)}</div></td><td><select style="width:auto;height:34px" onchange="adminSet('${r.id}',null,this.value)">${opt(PLANS.map(x=>[x.id,x.id]),r.plan)}</select></td><td>${B(r.status==='active'?'Active':'Suspended')}</td><td class="r">${r.members}</td><td class="r">${r.invoices}</td><td class="r">${r.valid}</td><td class="r" style="${r.invalid?'color:var(--err);font-weight:600':''}">${r.invalid}</td><td class="r">${r.processing}</td><td style="min-width:130px"><div class="meter"><i style="width:${Math.min(100,r.docs_month/lim(r.plan)*100)}%"></i></div><div class="muted sm">${r.docs_month} / ${lim(r.plan)}</div></td><td class="nowrap sm">${fmtDT(r.last_ok)}</td><td class="r">${r.status==='active'?`<button class="btn sm d" onclick="confirmBox('Suspend ${esc(r.name).replace(/'/g,'')}?','Members can still view but cannot change data or submit to LHDN.','Suspend',()=>adminSet('${r.id}','suspended'),true)">Suspend</button>`:`<button class="btn sm" onclick="adminSet('${r.id}','active')">Reactivate</button>`}</td></tr>`).join('')}</tbody></table></div>`:empty('brief','No businesses yet','Registered companies appear here.')}</div>`)}
 if(t==='subscriptions'){const by=PLANS.map(pl=>({...pl,n:active.filter(r=>r.plan===pl.id).length}));const near=R.filter(r=>r.docs_month>=lim(r.plan)*.8);
  return adminShell(t,head('Subscriptions','Plans, recurring revenue and quota pressure.')+`<div class="grid g4">${k('Monthly recurring revenue',money(active.reduce((a,r)=>a+price(r.plan)*100,0)),'List price, active companies')}${k('Active subscriptions',active.length,'')}${k('Suspended',R.length-active.length,'')}${k('Near quota (≥80%)',near.length,'this month')}</div>
  <div class="grid g2 mt"><div class="card pad"><h3 class="mb">Plan distribution</h3>${by.map(pl=>`<div class="row sb sm" style="padding:6px 0"><span>${pl.id} · RM${pl.price}</span><b>${pl.n}</b></div><div class="meter"><i style="width:${active.length?pl.n/active.length*100:0}%"></i></div>`).join('')}</div>
  <div class="card pad"><h3 class="mb">Quota warnings</h3>${near.length?near.map(r=>`<div class="row sb sm" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(r.name)} · ${esc(r.plan)}</span><b>${r.docs_month}/${lim(r.plan)}</b></div>`).join(''):'<p class="muted sm">No company is near its limit.</p>'}</div></div>
  <div class="note mt">Subscription payments and billing history require the payment gateway integration. Plan changes are made here by platform admins and are recorded in the audit log. Plan limits and prices can be configured in <code>config.js</code> (<code>plans</code>).</div>`)}
 if(t==='monitor'){const ev=D.events;const cnt=kd=>ev.filter(e=>e.kind===kd).length;const stuck=R.filter(r=>r.processing>0);
  return adminShell(t,head('LHDN API Monitor','Submission health across all companies. External LHDN processing time is separate from app performance.')+`<div class="grid g4">${k('Validation failure rate',done?Math.round(sum('invalid')/done*100)+'%':'—',sum('invalid')+' invalid of '+done)}${k('Processing backlog',sum('processing'),stuck.length+' companies')}${k('Rate-limit events (429)',cnt('429'),'')}${k('Auth / permission errors',cnt('auth'),cnt('5xx')+' server errors (5xx)')}</div>
  ${sum('invalid')&&done&&sum('invalid')/done>.2?'<div class="note e mt"><b>Alert:</b> validation failure rate is above 20%. Check recent changes and common errors.</div>':''}
  <div class="grid g2 mt"><div class="card"><div class="ch"><h3>Recent incidents</h3></div>${ev.length?`<div class="tw"><table class="t" style="min-width:480px"><thead><tr><th>Time</th><th>Company</th><th>Type</th><th>Detail</th></tr></thead><tbody>${ev.slice(0,100).map(e=>`<tr><td class="nowrap sm">${fmtDT(e.created_at)}</td><td class="sm">${esc(e.company||'—')}</td><td><span class="badge ${e.kind==='429'?'b-warn':'b-err'}">${esc(e.kind)}</span></td><td class="sm mono">${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted pad">No incidents recorded.</p>`}</div>
  <div class="card"><div class="ch"><h3>Documents awaiting validation</h3></div>${stuck.length?stuck.map(r=>`<div class="row sb pad-s" style="border-bottom:1px solid var(--line)"><span>${esc(r.name)}</span><b>${r.processing}</b></div>`).join(''):`<p class="muted pad">Nothing processing.</p>`}</div></div>`)}
 if(t==='users')return adminShell(t,head('Users','Registered accounts. Platform admins cannot impersonate users.')+`<div class="card">${D.users.length?`<div class="tw"><table class="t"><thead><tr><th>User</th><th>Registered</th><th>Last sign-in</th><th class="r">Companies</th><th>Role</th></tr></thead><tbody>${D.users.map(u=>`<tr><td><b>${esc(u.name||u.email)}</b><div class="muted sm">${esc(u.email)}</div></td><td>${fmtDate(u.created_at)}</td><td>${fmtDT(u.last_sign_in_at)}</td><td class="r">${u.companies}</td><td>${u.is_admin?'<span class="badge b-navy">Platform admin</span>':'<span class="badge">User</span>'}</td></tr>`).join('')}</tbody></table></div>`:empty('users','No users','')}</div>`);
 if(t==='demo'){const demos=DB.companies.filter(c=>c.demo);const docs=demos.reduce((n,c)=>n+c.invoices.length,0);
  return adminShell(t,head('Demo Lab','Test MYR Invoice without a personal passport, taxpayer TIN or registered company.')+
  '<div class="note w mb"><b>Safe testing only:</b> All sample company details and invoices are fictional. No LHDN API submissions, taxpayer registration or public buyer links are made from Demo Lab. Demonstration results are not official LHDN approvals.</div>'+
  '<div class="grid g3">'+k('Demo workspaces',demos.length,'Owned by this admin')+k('Sample invoices',docs,'Draft data only')+k('Real LHDN submissions','Blocked','Server-side safety protection')+'</div>'+
  '<div class="card pad mt"><h3 class="mb8">Your demo workspace</h3><p class="muted sm mb">Create an isolated fictional company with sample customers, products, invoices and payment records. Your existing company remains unchanged.</p>'+
  (demos.length?demos.map(c=>'<div class="row sb" style="gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap"><div><b>'+esc(c.name)+'</b><div class="muted sm">'+c.invoices.length+' invoices · '+c.customers.length+' customers · '+c.products.length+' products</div></div><button class="btn p sm" onclick="openDemo(\''+c.id+'\')">Open demo workspace</button></div>').join(''):'<button class="btn p" onclick="demoCompany()">Create fictional demo workspace</button>')+
  '</div><div class="card pad mt"><h3 class="mb8">Recommended tests</h3><p class="muted sm">Create an invoice → save a draft → edit items → print/download PDF → record a payment → review reports. Use E-Invoice Centre for local compliance validation only.</p><p class="muted sm mt8">To test real MyInvois submission later, a registered taxpayer must separately authorize the intermediary.</p><div class="row mt" style="gap:10px;flex-wrap:wrap"><button class="btn sm" onclick="previewDemoLhdn(\'valid\')">Preview simulated acceptance</button><button class="btn sm" onclick="previewDemoLhdn(\'invalid\')">Preview simulated rejection</button></div></div>')}
 if(t==='security')return adminShell(t,head('Security & Audit','Platform controls and admin action history.')+`<div class="grid g2"><div class="card pad"><h3 class="mb">Platform safeguards</h3>${[['Tenant isolation','Row-level security by company membership (verified email).'],['Official status integrity','LHDN results are written only by the server function; browsers cannot mark a document Valid.'],['Secrets','LHDN credentials live in Supabase Edge Function secrets, never in the browser.'],['Admin visibility','Admins see aggregates only — no invoice contents and no impersonation.'],['Append-only audit','Audit log rows cannot be edited or deleted by users.'],['Public links','Buyer QR and invoice links are random tokens with expiry and submission limits.']].map(([a,b])=>`<div class="list-i"><span class="pri l"></span><div><b class="sm">${a}</b><div class="muted sm">${b}</div></div></div>`).join('')}</div>
  <div class="card"><div class="ch"><h3>Admin actions</h3></div>${D.audit.length?D.audit.slice(0,50).map(a=>`<div class="pad-s sm" style="border-bottom:1px solid var(--line)"><b>${esc(a.action)}</b> <span class="muted">${esc(a.detail)}</span><div class="muted" style="font-size:11.5px">${fmtDT(a.created_at)} · ${esc(a.actor_email)}</div></div>`).join(''):`<p class="muted pad">No admin actions yet.</p>`}</div></div>`);
 const newR=R.filter(r=>r.created_at&&new Date(r.created_at)>new Date(Date.now()-30*864e5)).length;
 return adminShell(t,head('Platform overview','All businesses on MYR Invoice.')+`<div class="grid g4">${k('Registered businesses',R.length,newR+' new in 30 days')}${k('Active subscriptions',active.length,(R.length-active.length)+' suspended')}${k('Monthly recurring revenue',money(active.reduce((a,r)=>a+price(r.plan)*100,0)),'list price')}${k('Users',D.users.length,'')}</div>
 <div class="grid g4 mt">${k('Total documents',sum('invoices'),'')}${k('LHDN valid',sum('valid'),'')}${k('Invalid',sum('invalid'),done?Math.round(sum('invalid')/done*100)+'% failure rate':'')}${k('Processing queue',sum('processing'),D.events.filter(e=>e.kind==='429').length+' rate-limit events')}</div>
 <div class="grid g2 mt"><div class="card"><div class="ch"><h3>Newest businesses</h3><a class="btn g sm" href="#/admin/businesses">All</a></div>${R.slice(0,6).map(r=>`<div class="row sb pad-s" style="border-bottom:1px solid var(--line)"><div><b class="sm">${esc(r.name)}</b><div class="muted sm">${esc(r.owner||'')} · ${fmtDate(r.created_at)}</div></div><div class="row">${B(r.status==='active'?'Active':'Suspended')}<span class="badge">${esc(r.plan)}</span></div></div>`).join('')||'<p class="muted pad">None yet.</p>'}</div>
 <div class="card"><div class="ch"><h3>Recent LHDN incidents</h3><a class="btn g sm" href="#/admin/monitor">Monitor</a></div>${D.events.slice(0,6).map(e=>`<div class="pad-s sm" style="border-bottom:1px solid var(--line)"><span class="badge ${e.kind==='429'?'b-warn':'b-err'}">${esc(e.kind)}</span> ${esc(e.company||'')} <span class="muted mono">${esc(e.detail)}</span><div class="muted" style="font-size:11.5px">${fmtDT(e.created_at)}</div></div>`).join('')||'<p class="muted pad">No incidents.</p>'}</div></div>`)}
async function adminSet(id,status,plan){if(CLOUD){const {error}=await SB.rpc('admin_set_company',{p_id:id,p_status:status||null,p_plan:plan||null});if(error)return toast(error.message,'err');ADM.loaded=false;const c=DB.companies.find(x=>x.id===id);if(c){if(status)c.status=status;if(plan)c.plan=plan}}
 else{const c=DB.companies.find(x=>x.id===id);if(!c)return;if(status)c.status=status;if(plan)c.plan=plan;audit(c,'admin.company',[status&&'status='+status,plan&&'plan='+plan].filter(Boolean).join(' '));save()}toast('Company updated');route()}

/* ================= Boot ================= */
(async()=>{if(CLOUD&&!/^#\/(r|v)\//.test(location.hash)){paint(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px">${LOGO(44)}<div class="muted">Loading MYR Invoice…</div></div>`);try{await cloudInit()}catch(e){return paint(`<div class="mobile-page"><div class="box">${empty('alert','Could not connect',esc(e.message||String(e))+'<br>Check config.js (Supabase URL and anon key) and your internet connection.','<button class="btn p" onclick="location.reload()">Retry</button>')}</div></div>`)}}route()})();
if(CLOUD)window.addEventListener('beforeunload',e=>{if(PUSH_T||PUSHING||UNSYNCED_CLOUD){cloudPush();e.preventDefault();e.returnValue=''}});
</script>
</body>
</html>
