/* App shell */
.app{display:flex;min-height:100vh}
.side{width:252px;background:var(--navy);color:#B7C3D6;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:60;transition:transform .22s ease}
.brand{display:flex;align-items:center;gap:10px;padding:20px 20px 18px;color:#fff}.brand b{display:block;font-size:15px;letter-spacing:-.01em}.brand small{color:#8FA3C0;font-size:11.5px}
.nav{flex:1;overflow-y:auto;padding:6px 0}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;margin:1px 12px;border-radius:10px;color:#B7C3D6;font-weight:500;font-size:13.5px;transition:background .15s,color .15s}
.nav a:hover{background:rgba(255,255,255,.06);color:#fff}.nav a.on{background:var(--blue);color:#fff}
.nav .cnt{margin-left:auto;font-style:normal;background:#EF4444;color:#fff;border-radius:99px;font-size:11px;padding:0 7px;font-weight:700}
.side-f{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12px}
.envpill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.06)}.envpill i{width:8px;height:8px;border-radius:50%;background:#F59E0B}.envpill i.ok{background:#10B981}
.main{flex:1;margin-left:252px;min-width:0}
.top{height:64px;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 24px;position:sticky;top:0;z-index:40}
.cosel{max-width:280px;height:38px;font-weight:600}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;text-transform:uppercase}
.localbar{background:#FFFBEB;border-bottom:1px solid #FDE68A;color:#78350F;font-size:12px;padding:6px 24px;text-align:center}
.content{padding:24px;max-width:1320px;margin:0 auto}
.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}.ph h1{font-size:24px}.ph p{margin:4px 0 0;color:var(--muted)}
.back{font-size:12.5px;color:var(--muted);display:inline-block;margin-bottom:6px}
.menu-btn{display:none!important}.scrim{display:none}
@media(max-width:1024px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.3)}.side.open+.scrim{display:block;position:fixed;inset:0;background:rgba(11,31,58,.4);z-index:55}.main{margin-left:0}.menu-btn{display:inline-flex!important}.content{padding:16px}.top{padding:0 12px}.hide-sm{display:none}.localbar{padding:6px 12px}}
/* Builder */
.bgrid{display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:20px;align-items:start}
.bside{position:sticky;top:84px;display:grid;gap:16px}
@media(max-width:1180px){.bgrid{grid-template-columns:1fr}.bside{position:static}}
.sec{margin-bottom:16px}.sh{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.stepn{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;display:inline-flex;align-items:center;justify-content:center}
.line{border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;background:#FCFDFF}
.lgrid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}
.lgrid .full{grid-column:1/-1}
@media(max-width:700px){.lgrid{grid-template-columns:1fr 1fr}}
.tot{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}.tot.big{font-size:18px;font-weight:700;color:var(--navy);border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.score{display:flex;align-items:center;gap:14px}
.ring{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--navy);flex:none}
.cbox{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
/* Modal & toast */
.mbk{position:fixed;inset:0;background:rgba(11,31,58,.5);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fade .15s}
.md{background:#fff;border-radius:18px;max-width:560px;width:100%;max-height:92vh;overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.25);animation:pop .18s ease}
.md.wide{max-width:900px}.md .mh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}.md .mbd{padding:20px}.md .mf{display:flex;justify-content:flex-end;gap:10px;padding:14px 20px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}}
#toasts{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:300;max-width:calc(100vw - 32px)}
.toast{background:var(--navy);color:#fff;padding:12px 16px;border-radius:12px;font-size:13.5px;box-shadow:0 10px 30px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;animation:pop .2s;max-width:420px}
.toast.err{background:#991B1B}.toast.warn{background:#92400E}
.skel{background:linear-gradient(90deg,#EEF2F7 25%,#F6F8FB 50%,#EEF2F7 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;height:14px}@keyframes sk{to{background-position:-200% 0}}
/* Document */
.doc{background:#fff;color:#0F172A;padding:36px;border:1px solid var(--line);border-radius:14px;position:relative;font-size:12.5px;overflow:hidden}
.doc h2{font-size:22px}.doc table{width:100%;border-collapse:collapse;margin-top:18px}.doc th{background:#F1F5FB;color:#334155;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px}.doc td{padding:8px;border-bottom:1px solid #EEF2F7;vertical-align:top}
.doc .parties{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:22px}.doc .parties h4{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:#64748B;margin-bottom:6px}
.doc .wm{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;font-size:56px;font-weight:800;color:rgba(220,38,38,.08);transform:rotate(-22deg);text-align:center;line-height:1.1}
.doc .lhdn{display:flex;gap:16px;align-items:center;margin-top:22px;padding:14px;border:1px dashed #CBD5E1;border-radius:12px}
.doc .lhdn svg{width:110px;height:110px;flex:none}
@media(max-width:640px){.doc{padding:18px}.doc .parties{grid-template-columns:1fr}}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}#print .doc{border:0;padding:0}@page{margin:14mm}}
/* Public site */
.site{background:#fff}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.sh-top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.sh-top .wrap{display:flex;align-items:center;height:68px;gap:24px}
.sh-nav{display:flex;gap:22px;flex:1}.sh-nav a{color:var(--ink2);font-weight:500;cursor:pointer}.sh-nav a:hover{color:var(--blue)}
@media(max-width:900px){.sh-nav{display:none}}
.hero{padding:76px 0 40px;background:linear-gradient(180deg,#F7F9FC 0%,#fff 100%)}
.hero h1{font-size:54px;line-height:1.05;letter-spacing:-.035em;max-width:820px}
.hero .lead{font-size:18px;color:var(--muted);max-width:640px;margin:18px 0 28px}
@media(max-width:700px){.hero{padding:44px 0 24px}.hero h1{font-size:36px}.hero .lead{font-size:16px}}
.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:6px 12px;border-radius:99px;background:var(--b50);color:var(--blue);font-weight:600;font-size:12.5px;margin-bottom:18px}
.preview{margin-top:48px;border-radius:20px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(11,31,58,.12);overflow:hidden;background:var(--off)}
.pv-bar{height:38px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 14px}.pv-bar i{width:10px;height:10px;border-radius:50%;background:#E2E8F0}
.pv{display:grid;grid-template-columns:180px 1fr;min-height:360px}.pv-side{background:var(--navy);padding:16px 12px}.pv-side div{height:28px;border-radius:8px;margin-bottom:6px;background:rgba(255,255,255,.06)}.pv-side div.on{background:var(--blue)}
.pv-main{padding:18px}@media(max-width:700px){.pv{grid-template-columns:1fr}.pv-side{display:none}}
section.s{padding:84px 0}section.s.alt{background:var(--off)}
@media(max-width:700px){section.s{padding:56px 0}}
.sec-h{text-align:center;max-width:720px;margin:0 auto 44px}.sec-h h2{font-size:36px;letter-spacing:-.03em}.sec-h p{color:var(--muted);font-size:16.5px;margin-top:12px}
@media(max-width:700px){.sec-h h2{font-size:28px}}
.feat{padding:24px}.feat .fi{width:42px;height:42px;border-radius:12px;background:var(--b50);color:var(--blue);display:flex;align-items:center;justify-content:center;margin-bottom:14px}.feat h3{font-size:16.5px;margin-bottom:6px}.feat p{color:var(--muted);margin:0}
.flag{border:1px solid #C7D7FE;background:linear-gradient(180deg,#F5F8FF,#fff)}
.stepc{padding:24px;position:relative}.stepc .n{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:10px}
.price{padding:28px;display:flex;flex-direction:column}.price.hl{border:2px solid var(--blue);box-shadow:0 20px 50px rgba(37,99,235,.15)}.price .amt{font-size:40px;font-weight:800;color:var(--navy);letter-spacing:-.03em}.price ul{list-style:none;padding:0;margin:18px 0 22px;flex:1}.price li{padding:6px 0;display:flex;gap:8px;align-items:flex-start;color:var(--ink2)}.price li svg{color:var(--ok);flex:none;margin-top:2px}.price li.no{color:#94A3B8}.price li.no svg{color:#CBD5E1}
.faq details{border-bottom:1px solid var(--line);padding:18px 0}.faq summary{font-weight:600;cursor:pointer;color:var(--navy);font-size:15.5px;list-style:none;display:flex;justify-content:space-between}.faq summary::after{content:'+';color:var(--blue);font-size:20px;line-height:1}.faq details[open] summary::after{content:'–'}.faq details p{color:var(--muted);margin:10px 0 0}
.cta{background:var(--navy);color:#fff;border-radius:24px;padding:56px;text-align:center}.cta h2{color:#fff;font-size:34px}.cta p{color:#B7C3D6;font-size:16px;margin:12px 0 26px}
@media(max-width:700px){.cta{padding:36px 22px}.cta h2{font-size:26px}}
footer.ft{background:var(--navy);color:#B7C3D6;padding:56px 0 28px;margin-top:84px}footer.ft h4{color:#fff;font-size:13px;margin-bottom:12px}footer.ft a{color:#B7C3D6;display:block;padding:4px 0;cursor:pointer}footer.ft a:hover{color:#fff}
.cmp td:nth-child(2),.cmp td:nth-child(3),.cmp th:nth-child(2),.cmp th:nth-child(3){text-align:center}
/* Auth & buyer */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}.auth-l{background:var(--navy);color:#B7C3D6;padding:48px;display:flex;flex-direction:column;justify-content:space-between}.auth-l h2{color:#fff;font-size:34px;letter-spacing:-.03em}.auth-r{display:flex;align-items:center;justify-content:center;padding:32px 20px;background:#fff}.auth-box{width:100%;max-width:400px}
@media(max-width:900px){.auth{grid-template-columns:1fr}.auth-l{display:none}}
.mobile-page{min-height:100vh;background:var(--off);padding:20px 16px 40px}.mobile-page .box{max-width:520px;margin:0 auto}
.upload{border:2px dashed #CBD5E1;border-radius:16px;padding:36px;text-align:center;background:#FCFDFF;cursor:pointer;transition:.15s}.upload:hover{border-color:var(--blue);background:var(--b50)}
.qrwrap svg{width:220px;height:220px}
.chart-bar{transition:opacity .15s}.chart-bar:hover{opacity:.8}

/* Responsive safeguard: tables scroll inside cards rather than stretching dashboard grids. */
.grid > *, .card { min-width: 0; }
.tw { max-width: 100%; }
.toast { overflow-wrap: anywhere; }
/* Premium public landing only — application and admin styles unchanged. */

const LHDN={base(co){const u=(co.lhdn.proxyUrl||'').trim()||(CLOUD?(CFG.lhdnFunctionUrl||CFG.supabaseUrl.replace(/\/+$/,'')+'/functions/v1/lhdn'):'');return u.replace(/\/+$/,'')},

 async call(co,method,path,body,invId){const b=this.base(co);if(!b)throw Object.assign(new Error('LHDN backend is not connected. Configure it in Integrations.'),{kind:'config'});
  for(let attempt=0;attempt<5;attempt++){let res;
   try{res=await fetch(b+'/lhdn'+path,{method,headers:await this.headers(co,invId),body:body?JSON.stringify(body):undefined})}
   catch(e){if(attempt<2){await sleep(1000*2**attempt);continue}throw Object.assign(new Error('Network error — could not reach the LHDN backend.'),{kind:'transport'})}
   if(res.status===429){const ra=Math.min(+res.headers.get('Retry-After')||2**attempt*2,60);co.lhdn.incidents.unshift({at:new Date().toISOString(),type:'429',detail:'Rate limited on '+path+'; waited '+ra+'s'});co.lhdn.incidents.length=Math.min(co.lhdn.incidents.length,100);await sleep(ra*1000);continue}
   if(res.status>=500&&attempt<3){await sleep(1500*2**attempt);continue}
   const txt=await res.text();let data=null;try{data=txt?JSON.parse(txt):null}catch(e){data={raw:txt.slice(0,500)}}
   const msg=data&&(data.error?.message||data.error?.details?.[0]?.message||data.message||data.error_description||(typeof data.error==='string'?data.error:''));
   if(res.status===401||res.status===403){co.lhdn.health='auth_error';throw Object.assign(new Error(msg||'Authorization failed — check intermediary permission for this taxpayer.'),{kind:'auth',status:res.status,data})}
   if(!res.ok)throw Object.assign(new Error(msg||('LHDN returned HTTP '+res.status)),{kind:'api',status:res.status,data});

function flattenErr(e,step){if(!e)return [];const out=[];const walk=x=>{if(!x||typeof x!=='object')return;const m=x.error||x.message;if(m&&typeof m==='string')out.push({code:x.errorCode||x.code||'',message:m,path:x.propertyPath||x.target||x.propertyName||'',step:step||''});(x.innerError||x.details||[]).forEach(walk)};walk(e);return out.length?out:[{code:'',message:JSON.stringify(e).slice(0,300),path:'',step:step||''}]}
const BUSY=new Set();
async function submitInvoice(id){const co=CO();const inv=co.invoices.find(i=>i.id===id);if(!inv)return;
 if(co.demo)return toast('DEMO MODE: real LHDN submission is disabled. Test drafts, PDFs and compliance checks instead.','warn');
 if(!can('Submit'))return toast('Your role cannot submit documents.','err');

 if(inv.appStatus==='Approval Pending'||inv.appStatus==='Draft')return toast('Mark the document Ready'+(co.approvalRequired?' and approved':'')+' before submission.','warn');
 const r=runCheck(inv,co);if(r.errors.length){toast(r.errors.length+' compliance issue(s) must be fixed first.','err');return go('#/app/invoices/edit/'+id)}
 if(BUSY.has(id))return;

 let built;try{built=await buildPayload(inv,co)}catch(e){return toast(e.message,'err')}

 if(last&&last.hash===built.payload.documents[0].documentHash&&last.result==='accepted')return toast('Identical document already accepted — refreshing status instead.','warn'),refreshStatus(id);
 const att={id:uuid(),at:new Date().toISOString(),hash:built.payload.documents[0].documentHash,env:co.lhdn.env};inv.lhdn.attempts.push(att);
 if(!LHDN.base(co)){inv.appStatus='Submission Queued';att.result='queued';att.detail='Backend not connected — nothing was sent to LHDN';tl(inv,'Queued for submission. Nothing was sent: LHDN backend not connected.');audit(co,'invoice.queue',inv.number);save();toast('Queued. Connect the LHDN backend in Integrations to send it.','warn');return rerender()}
 BUSY.add(id);toast('Submitting '+inv.number+' to LHDN '+co.lhdn.env+'…');rerender();
 try{const d=await LHDN.call(co,'POST','/api/v1.0/documentsubmissions',built.payload,inv.id);
  inv.lhdn.submissionUid=d?.submissionUid||'';att.submissionUid=inv.lhdn.submissionUid;
  const acc=(d?.acceptedDocuments||[]).find(a=>a.invoiceCodeNumber===inv.number)||(d?.acceptedDocuments||[])[0];const rej=(d?.rejectedDocuments||[]).find(a=>a.invoiceCodeNumber===inv.number)||(d?.rejectedDocuments||[])[0];
  if(acc){inv.lhdn.uuid=acc.uuid;inv.lhdn.status='Submitted';inv.lhdn.errors=[];inv.appStatus='Submitted';att.result='accepted';co.lhdn.lastOk=new Date().toISOString();countUsage(co);tl(inv,'Accepted for processing by LHDN (Submission UID '+inv.lhdn.submissionUid+'). Waiting for validation.')}

 }catch(e){att.result=e.kind;att.detail=e.message;inv.lhdn.lastError={kind:e.kind,message:e.message,at:new Date().toISOString()};tl(inv,'Submission failed ('+e.kind+'): '+e.message);toast(e.message,'err')}
 finally{BUSY.delete(id);audit(co,'invoice.submit',inv.number+' → '+(att.result||'?'));save();rerender()}

async function pollStatus(id){for(const ms of [3000,5000,8000,13000,21000,34000]){await sleep(ms);const co=CO();const inv=co?.invoices.find(i=>i.id===id);if(!inv||inv.lhdn.status!=='Submitted')return;await refreshStatus(id,true);if(inv.lhdn.status!=='Submitted')return}}
async function refreshStatus(id,quiet){const co=CO();const inv=co.invoices.find(i=>i.id===id);if(!inv)return;

const atomicEnabled=()=>CLOUD&&CFG.atomicRecordWrites===true;
async function atomicReady(co){
 if(!atomicEnabled())return true;
 clearTimeout(PUSH_T);PUSH_T=null;
 if(PUSHING){toast('Cloud is saving. Please retry when previous save finishes.','warn');return false}
 if(UNSYNCED_CLOUD||PUSHED[co.id]!==fnv(JSON.stringify(coBody(co)))){
  if(!(await cloudPush())){toast('Complete pending cloud sync before saving this record.','err');return false}

function atomicApply(co,result,before){
 if(!result||!result.company_data||!Number.isInteger(Number(result.version)))return false;
 const server=clone(result.company_data),after=coBody(co);
 const merged=window.MYR_CONCURRENCY?.mergeCompany(before||after,after,server);
 if(!merged?.ok){
  toast('Record saved on server but other unsaved changes conflict. Keep this page open and export your changes before refreshing.','err');
  return false;
 }
 const members=co.members,status=co.status,plan=co.plan;
 for(const key of Object.keys(co))
  if(!['_v','members','status'].includes(key))delete co[key];
 Object.assign(co,merged.data);
 co.members=members;co.status=status;co.plan=plan;co._v=Number(result.version);
 const local=coBody(co);
 const same=window.MYR_CONCURRENCY.canonical(local)===window.MYR_CONCURRENCY.canonical(server);
 BASELINES[co.id]=clone(same?local:server);
 PUSHED[co.id]=fnv(JSON.stringify(same?local:server));
 UNSYNCED_CLOUD=DB.companies.some(c=>c._v&&PUSHED[c.id]!==fnv(JSON.stringify(coBody(c))));
 if(UNSYNCED_CLOUD)save();
 return true;
}

async function syncLinks(co){if(co.demo){LINKS[co.id]=new Set();return}const want=[];
 co.requests.forEach(r=>want.push({token:r.token,company_id:co.id,kind:'qr',ref_id:r.id,expires_at:r.expiresAt,closed:['Approved','Declined'].includes(r.status),meta:{label:r.label,receipt:r.receipt||'',state:r.status}}));
 co.invoices.forEach(inv=>{if(inv.share&&inv.share.token)want.push({token:inv.share.token,company_id:co.id,kind:'invoice',ref_id:inv.id,expires_at:inv.share.exp,closed:false,meta:portalSnapshot(co,inv)})});
 const changed=want.filter(w=>{const h=fnv(JSON.stringify(w));if(LINKH[w.token]===h)return false;LINKH[w.token]=h;return true});
 if(changed.length){const {error}=await SB.from('public_links').upsert(changed,{onConflict:'token'});if(error){changed.forEach(w=>delete LINKH[w.token]);toast('Link sync failed: '+error.message,'err')}}
 const have=LINKS[co.id]||new Set();const keep=new Set(want.map(w=>w.token));const stale=[...have].filter(t=>!keep.has(t));
 if(stale.length)await SB.from('public_links').delete().in('token',stale);LINKS[co.id]=keep}
let PUSHING=false;
async function cloudPush(){
 PUSH_T=null;
 if(!SB||!DB.session)return true;
 if(PUSHING){clearTimeout(PUSH_T);PUSH_T=setTimeout(cloudPush,500);return false}
 PUSHING=true;
 try{
  for(const co of DB.companies){
   if(!co._v)continue;
   if(co.status==='suspended'){
    if(PUSHED[co.id]!==fnv(JSON.stringify(coBody(co)))){
     toast('Suspended company data cannot be saved. Contact support.','err');return false;
    }
    continue;
   }
   for(let retry=0;retry<3;retry++){
    const body=coBody(co),h=fnv(JSON.stringify(body));
    if(PUSHED[co.id]===h)break;
    const {data,error}=await SB.from('companies')
      .update({data:body,name:co.name,tin:(co.tin||'').toUpperCase(),version:co._v+1})
      .eq('id',co.id).eq('version',co._v).select('version');
    if(error){
     toast('Cloud save failed: '+error.message+' — keep this tab open.','err');return false;
    }
    if(data?.length){
     co._v=data[0].version;
     BASELINES[co.id]=clone(body);
     PUSHED[co.id]=h;
     await syncLinks(co);
     break;
    }
    // Optimistic lock failed. Reload server snapshot and merge only independent
    // records. Never silently replace the same invoice or payment edited elsewhere.
    const {data:latest,error:readErr}=await SB.from('companies')
      .select('version,data,status,plan').eq('id',co.id).maybeSingle();
    if(readErr||!latest){
     toast('Could not check concurrent edits. Keep this tab open and retry.','err');return false;
    }
    if(latest.status!=='active'){
     toast('This company was suspended while you were editing. No changes sent.','err');return false;
    }
    const merged=window.MYR_CONCURRENCY?.mergeCompany(BASELINES[co.id],body,latest.data||{});
    if(!merged?.ok){
     toast('Concurrent edit conflict: '+(merged?.conflicts||['Please reload after exporting a backup']).slice(0,3).join(', ')+'. Your local changes were NOT overwritten.','err');
     return false;
    }
    // Do not overwrite user edits made while the async conflict check ran.
    if(fnv(JSON.stringify(coBody(co)))!==h){
     toast('More edits occurred during synchronization. Changes kept locally; retry save.','warn');
     return false;
    }
    const priorNumbers=new Map((body.invoices||[]).map(i=>[i.id,i.number]));
    Object.assign(co,merged.data);
    co.status=latest.status;co.plan=latest.plan;co._v=latest.version;
    for(const inv of co.invoices||[]){
     const oldNumber=priorNumbers.get(inv.id);
     if(oldNumber&&oldNumber!==inv.number)
      audit(co,'invoice.renumber',oldNumber+' -> '+inv.number+' (concurrent numbering)');
    }
    BASELINES[co.id]=clone(latest.data||{});
    PUSHED[co.id]=fnv(JSON.stringify(latest.data||{}));
    if(retry===2){
     toast('Several people are editing this company. Changes kept locally; retry save.','warn');
     return false;
    }
   }
  }
  UNSYNCED_CLOUD=DB.companies.some(c=>c._v&&PUSHED[c.id]!==fnv(JSON.stringify(coBody(c))));
  if(UNSYNCED_CLOUD){clearTimeout(PUSH_T);PUSH_T=setTimeout(cloudPush,700)}
  return !UNSYNCED_CLOUD;
 }catch(e){
  console.error('MYR Invoice cloud save',e);
  toast('Cloud save failed: '+(e.message||String(e)),'err');return false;
 }finally{PUSHING=false}
}
async function cloudCreate(co){const body=coBody(co);const {error}=await SB.from('companies').insert({id:co.id,name:co.name,tin:(co.tin||'').toUpperCase(),plan:'Starter',data:body});if(error){toast('Could not create company: '+error.message,'err');return false}/* INSERT without RETURNING: owner membership is added by the AFTER INSERT trigger. The new row is not SELECT-visible until that trigger has run. */co.plan='Starter';co._v=1;co.status='active';PUSHED[co.id]=fnv(JSON.stringify(body));BASELINES[co.id]=clone(body);LINKS[co.id]=new Set();await syncLinks(co);return true}

async function bSave(status){
 if(INVOICE_SAVING)return;
 INVOICE_SAVING=true;
 try{
  const co=CO();
  if(!co||(!can('Edit Draft')&&!can('Create')))return toast('Not allowed to edit documents.','err');
  ED.number=(ED.number||'').trim();
  ED.currency=(ED.currency||'MYR').toUpperCase();
  if(ED.currency==='MYR')ED.fxRate='';
  if(status==='Ready'){
   ED._checked=true;
   const r=bCheck();
   if(r.errors.length){
    toast(r.errors.length+' issue(s) must be fixed before marking ready.','err');
    $('#cpanel')?.scrollIntoView({behavior:'smooth',block:'center'});
    return;
   }
  }else if(!ED.number)return toast('Enter a document number.','err');
  if(co.invoices.some(o=>o.id!==ED.id&&o.number.toLowerCase()===ED.number.toLowerCase()))
   return toast('Duplicate document number.','err');
  const idx=co.invoices.findIndex(i=>i.id===ED.id);
  if(idx>=0&&locked(co.invoices[idx]))
   return toast('LHDN-submitted or cancelled documents cannot be edited.','err');

  if(atomicEnabled()&&!(await atomicReady(co)))return;
  let reserved=false;
  // A preview number is NOT assigned until this new invoice is actually saved.
  // The authenticated server RPC locks the tenant row, checks reservations and
  // allocates a unique number for concurrent invoices.
  if(CLOUD&&idx<0&&ED._autoNumber&&ED.number===ED._autoNumber){
   if(UNSYNCED_CLOUD){
    clearTimeout(PUSH_T);PUSH_T=null;
    if(!(await cloudPush())){
     toast('Save pending company changes first; invoice number was not reserved.','err');
     return;
    }
   }
   const {data,error}=await SB.rpc('reserve_invoice_number',{
    p_company_id:co.id,p_invoice_id:ED.id
   });
   if(error||!data||!data.number){
    toast('Unable to reserve invoice number: '+(error?.message||'server returned no number')+'. No invoice was saved.','err');
    return;
   }
   ED.number=String(data.number);
   co.nextNo=Math.max(Number(co.nextNo)||1001,Number(data.nextNo)||1001);
   reserved=true;
  }
  if(co.invoices.some(o=>o.id!==ED.id&&o.number.toLowerCase()===ED.number.toLowerCase()))
   return toast('Invoice number changed during save and is already used. Try again.','err');
  const rec=clone(ED);
  delete rec._checked;delete rec._autoNumber;delete rec._expected;
  if(idx>=0&&paidOf(co.invoices[idx])>calc(rec).total)
   return toast('Invoice total cannot be reduced below recorded payments. Adjust the payment first.','err');
  if(status==='Ready')
   rec.appStatus=co.approvalRequired&&!can('Approve')?'Approval Pending':'Ready';
  else if(idx<0||rec.appStatus==='Draft')rec.appStatus='Draft';
  if(atomicEnabled()){
   tl(rec,status?'Saved — status '+rec.appStatus:'Draft saved');
   const expected=idx>=0?(ED._expected||null):null;
   if(idx>=0&&!expected)return toast('Invoice edit has no revision snapshot. Reopen the invoice and retry.','err');
   const before=coBody(co);
   const {data,error}=await SB.rpc('atomic_save_record',{
    p_company_id:co.id,p_kind:'invoices',p_record:rec,p_expected:expected
   });
   if(error||!data){
    toast('Invoice record not saved: '+(error?.message||'Unknown error')+'. Reopen the document before retrying.','err');
    return;
   }
   if(!atomicApply(co,data,before))return;
   toast(status?(rec.appStatus==='Approval Pending'?'Sent for approval':'Saved and marked ready'):'Draft saved');
   go('#/app/invoices/view/'+rec.id);
   return;
  }
  if(idx<0){
   if(!reserved&&rec.number===co.prefix+co.nextNo)co.nextNo++;
   tl(rec,'Created');co.invoices.unshift(rec);
  }else co.invoices[idx]=rec;
  tl(rec,status?'Saved — status '+rec.appStatus:'Draft saved');
  audit(co,idx<0?'invoice.create':'invoice.update',rec.number+' · '+rec.appStatus);
  save();
  if(CLOUD){
   clearTimeout(PUSH_T);PUSH_T=null;
   if(!(await cloudPush())){
    toast('Invoice was not confirmed saved in the cloud. Keep this tab open and retry Save.','err');
    return;
   }
  }
  toast(status?(rec.appStatus==='Approval Pending'?'Sent for approval':'Saved and marked ready'):'Draft saved');
  go('#/app/invoices/view/'+rec.id);
 }catch(e){
  toast('Invoice save failed: '+(e?.message||String(e))+' — keep this tab open.','err');
 }finally{INVOICE_SAVING=false}
}

function delInvoice(id){const co=CO(),inv=co?.invoices.find(i=>i.id===id);if(!can('Edit Draft'))return toast('You cannot delete invoices.','err');if(!inv)return toast('Document not found.','err');if(locked(inv)||inv.lhdn?.attempts?.length||inv.lhdn?.status!=='Not Submitted')return toast('Submitted or attempted e-Invoices cannot be deleted.','err');if(paidOf(inv)>0)return toast('Remove or reverse recorded payments before deleting this draft.','err');confirmBox('Delete draft?','This unpaid draft has never been submitted to LHDN and will be permanently removed.','Delete',async()=>{const current=CO(),i=current.invoices.findIndex(x=>x.id===id);if(i<0)return toast('Document already removed.','warn');const item=current.invoices[i];if(locked(item)||item.lhdn?.attempts?.length||paidOf(item)>0)return toast('Deletion is no longer allowed.','err');audit(current,'invoice.delete',item.number);current.invoices.splice(i,1);save();if(CLOUD){clearTimeout(PUSH_T);PUSH_T=null;if(!(await cloudPush()))return toast('Deletion is not confirmed in cloud. Use Retry save before leaving.','err')}toast('Draft deleted');go('#/app/invoices')},true)}

function payModal(id){PAYMENT_PENDING_ID=null;if(!can('Edit Draft'))return toast('Your role cannot record payments.','err');const inv=CO().invoices.find(i=>i.id===id);if(!inv||inv.lhdn.status==='Cancelled')return toast('Cannot record payment for this invoice.','err');modal('Record payment — '+esc(inv.number),`<div class="grid g2">${field('py-a','Amount ('+inv.currency+')',(balance(inv)/100).toFixed(2),'text','inputmode="decimal"')}${field('py-d','Payment date',todayStr(),'date','max="'+todayStr()+'"')}<div class="fg"><label class="f">Method</label><select id="py-m">${opt(['Bank transfer','FPX','DuitNow','DuitNow QR','Card','Cash','Cheque'].map(x=>[x,x]))}</select></div>${field('py-r','Reference','','text','placeholder="Bank ref / receipt no."')}</div><p class="muted sm">Record only payments you have confirmed in your bank or gateway. A displayed QR does not prove payment.</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="savePay('${id}')">Save payment</button>`)}
let PAYMENT_SAVING=false,PAYMENT_PENDING_ID=null;
async function savePay(id){
 if(PAYMENT_SAVING)return;
 if(!can('Edit Draft'))return toast('Your role cannot record payments.','err');
 const co=CO(),inv=co?.invoices.find(i=>i.id===id);
 if(!inv||inv.lhdn.status==='Cancelled')return toast('Cannot record payment on this invoice.','err');
 const raw=val('py-a').trim(),amount=toSen(raw),date=val('py-d')||todayStr();
 if(!/^\d+(\.\d{1,2})?$/.test(raw)||!Number.isSafeInteger(amount)||amount<=0)
  return toast('Enter a positive amount with up to 2 decimals.','err');
 if(amount>balance(inv))return toast('Amount exceeds the balance of '+money(balance(inv),inv.currency),'err');
 if(!/^\d{4}-\d{2}-\d{2}$/.test(date)||date>todayStr())
  return toast('Payment date must be today or earlier.','err');
 PAYMENT_SAVING=true;
 try{
  if(atomicEnabled()&&!(await atomicReady(co)))return;
  if(!PAYMENT_PENDING_ID)PAYMENT_PENDING_ID=uuid();
  const payment={id:PAYMENT_PENDING_ID,date,amount,method:val('py-m'),ref:val('py-r'),by:DB.session,at:new Date().toISOString()};
  if(atomicEnabled()){
   const before=coBody(co);
   const {data,error}=await SB.rpc('atomic_add_payment',{
    p_company_id:co.id,p_invoice_id:id,p_payment:payment
   });
   if(error||!data){
    toast('Payment was not confirmed saved: '+(error?.message||'Unknown error')+'. Keep this form open.','err');
    return;
   }
   if(!atomicApply(co,data,before))return;
   PAYMENT_PENDING_ID=null;
   closeModal();toast(data.existing?'Payment already recorded':'Payment recorded and saved');rerender();
   return;
  }
  inv.payments.push(payment);tl(inv,'Payment recorded '+money(amount,inv.currency));
  audit(co,'payment.record',inv.number+' '+money(amount,inv.currency));
  save();
  if(CLOUD){
   clearTimeout(PUSH_T);PUSH_T=null;
   if(!(await cloudPush())){
    closeModal();
    toast('Payment is NOT confirmed saved in cloud. Keep this tab open; do not record it twice.','err');
    rerender();return;
   }
  }
  PAYMENT_PENDING_ID=null;
  closeModal();toast('Payment recorded and saved');rerender();
 }finally{PAYMENT_SAVING=false}
}
function remind(id){if(!can('Edit Draft'))return toast('Your role cannot prepare payment reminders.','err');const co=CO();const inv=co.invoices.find(i=>i.id===id);const c=custOf(co,inv)||{};if(!c.email)return toast('Customer has no email address.','err');if(balance(inv)<=0)return toast('This invoice has no outstanding balance.','warn');const sub=`Payment reminder: ${inv.number} from ${co.name}`;const body=`Dear ${c.name},\n\nThis is a friendly reminder that invoice ${inv.number} dated ${fmtDate(inv.issueDate)} has an outstanding balance of ${money(balance(inv),inv.currency)}${inv.dueDate?`, due on ${fmtDate(inv.dueDate)}`:''}.\n\nIf you have already paid, please ignore this message or reply with the payment reference.\n\nThank you,\n${co.name}\n${co.phone||''}`;tl(inv,'Email reminder draft requested for '+c.email+' (delivery not verified)');save();toast('An email draft will open; sending is not confirmed.','warn');location.href=`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent(sub)}&body=${encodeURIComponent(body)}`}
function shareInv(id){const co=CO();if(co.demo)return toast('Demo workspaces cannot create public customer links.','warn');const inv=co.invoices.find(i=>i.id===id);if(!inv)return toast('Invoice not found.','err');if(!inv.share||new Date(inv.share.exp)<new Date())inv.share={token:rid(32),exp:addDays(todayStr(),30)};save();const url=location.origin+location.pathname+'#/v/'+inv.share.token;modal('Share with customer',`<p class="muted sm">A private link scoped to this single document. Expires ${fmtDate(inv.share.exp)}.</p><div class="row nw"><input id="sh-u" value="${esc(url)}" readonly><button class="btn" onclick="navigator.clipboard?.writeText(val('sh-u'));toast('Link copied')">Copy</button></div><div class="mt" style="text-align:center" class="qrwrap">${qrSvg(url,4)}</div><button class="btn sm d mt" onclick="CO().invoices.find(i=>i.id==='${id}').share=null;save();closeModal();toast('Link revoked')">Revoke link</button>`)}

function vRescue(co){const list=rescueList(co);const items=list.map(i=>{const r=runCheck(i,co);const kind=i.lhdn.status==='Invalid'?'Invalid at LHDN':i.lhdn.lastError?({transport:'Connection failure',auth:'Authorization failure',rate:'Rate limited',api:'Submission error'}[i.lhdn.lastError.kind]||'Failed'):'Blocked by compliance check';const errs=i.lhdn.status==='Invalid'?i.lhdn.errors.map(e=>({...explainErr(e),raw:e})):r.errors.map(e=>({title:e.problem,reason:e.reason,fix:e.action,field:e.field}));return {i,kind,errs,r}});
 const cats={};items.forEach(x=>x.errs.forEach(e=>cats[e.title]=(cats[e.title]||0)+1));const top=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,6);const custs=new Set(items.map(x=>x.i.customerId)).size;
 return `<div class="grid g4">${[['Invalid at LHDN',items.filter(x=>x.kind==='Invalid at LHDN').length],['Failed submissions',items.filter(x=>/failure|limited|error/i.test(x.kind)).length],['Blocked by checks',items.filter(x=>x.kind==='Blocked by compliance check').length],['Affected customers',custs]].map(([l,v])=>`<div class="card kpi"><div class="l">${l}</div><div class="v">${v}</div></div>`).join('')}</div>

  <div class="mt8">${x.errs.slice(0,5).map(e=>`<div class="iss"><b>${esc(e.title)}</b><div class="m">${esc(e.reason||'')}</div><div class="a">→ ${esc(e.fix)}</div>${e.raw?`<div class="muted mono mt8">${esc(e.raw.message)}</div>`:''}</div>`).join('')}${x.errs.length>5?`<p class="muted sm">+${x.errs.length-5} more</p>`:''}</div>
  <div class="row mt8"><a class="btn p sm" href="#/app/invoices/edit/${x.i.id}">${ic('buoy',14)}Fix now</a>${x.r.errors.length===0&&can('Submit')?`<button class="btn sm" onclick="confirmSubmit('${x.i.id}')">Retry submission</button>`:`<span class="muted sm">Retry available after local check passes</span>`}<a class="btn g sm" href="#/app/invoices/view/${x.i.id}">History</a></div></div>`).join(''):`<div class="card">${empty('buoy','Nothing to rescue','Invalid documents, failed submissions and documents blocked by checks will appear here with guided fixes.')}</div>`}</div>`}

function custTable(co){const q=CQ.q.toLowerCase();const l=co.customers.filter(c=>{if(CQ.f==='archived'?!c.archived:c.archived)return false;if(q&&!(`${c.name} ${c.tin} ${c.email} ${c.idValue}`.toLowerCase().includes(q)))return false;const e=custErrors(c).length;if(CQ.f==='issues'&&!e)return false;if(CQ.f==='ready'&&e)return false;return true});
 if(!l.length)return empty('users','No customers found','Add customers manually, import a spreadsheet, or collect details with a QR request.');

let CM_FROM_BUILDER=false;
let CM_EXPECTED=null;
function custModal(id,fromBuilder){CM_FROM_BUILDER=!!fromBuilder;const co=CO();const c=id?co.customers.find(x=>x.id===id):{name:'',tin:'',idType:'BRN',idValue:'',sst:'NA',email:'',phone:'',addr:{line:'',city:'',postcode:'',state:'14',country:'MYS'},creditDays:30};
 CM_EXPECTED=id?clone(c):null;
 modal(id?'Edit customer':'Add customer',`<div id="cm-err"></div><div class="grid g2"><div class="spanall">${field('cm-name','Registered name *',c.name)}</div><div class="fg"><label class="f">TIN *</label><div class="row nw"><input id="cm-tin" value="${esc(c.tin)}" style="text-transform:uppercase" placeholder="C… / IG… / EI…"><button class="btn" type="button" onclick="verifyTinUI()" title="Validate with LHDN">Verify</button></div><div class="hint" id="cm-tinr">Use EI00000000010 for general public, EI00000000020 for foreign buyers.</div></div>
 <div class="fg"><label class="f">ID type</label><select id="cm-idt">${opt([['BRN','BRN (business registration)'],['NRIC','NRIC (MyKad)'],['PASSPORT','Passport'],['ARMY','Army ID']],c.idType)}</select></div>${field('cm-idv','ID number *',c.idValue)}${field('cm-sst','SST no. (or NA)',c.sst||'NA')}${field('cm-email','Email',c.email,'email')}${field('cm-phone','Phone *',c.phone,'tel','placeholder="+60…"')}<div class="spanall">${field('cm-line','Address line *',c.addr?.line)}</div>${field('cm-city','City *',c.addr?.city)}${field('cm-post','Postcode',c.addr?.postcode)}<div class="fg"><label class="f">State *</label><select id="cm-state">${opt(STATES,c.addr?.state||'14')}</select></div>${field('cm-country','Country (ISO-3)',c.addr?.country||'MYS','text','maxlength="3" style="text-transform:uppercase"')}${field('cm-cd','Credit days',c.creditDays??30,'number','min="0"')}</div>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="saveCust('${id||''}')">Save customer</button>`,true)}
function readCustForm(){return {name:val('cm-name'),tin:val('cm-tin').toUpperCase(),idType:val('cm-idt'),idValue:val('cm-idv'),sst:val('cm-sst')||'NA',email:val('cm-email'),phone:val('cm-phone'),addr:{line:val('cm-line'),city:val('cm-city'),postcode:val('cm-post'),state:val('cm-state'),country:(val('cm-country')||'MYS').toUpperCase()},creditDays:+val('cm-cd')||0}}
async function saveCust(id){
 const co=CO(),d=readCustForm();
 if(!d.name)return $('#cm-err').innerHTML='<div class="note e mb">Name is required.</div>';
 const dup=co.customers.find(c=>c.id!==id&&!c.system&&
  ((d.tin&&c.tin===d.tin&&c.idValue===d.idValue&&!SPECIAL_TIN[d.tin])||
   c.name.toLowerCase()===d.name.toLowerCase()));
 if(dup&&!$('#cm-err').dataset.ok){
  $('#cm-err').dataset.ok='1';
  $('#cm-err').innerHTML='<div class="note w mb">Possible duplicate of <b>'+esc(dup.name)+'</b>. Click Save again to keep both.</div>';
  return;
 }
 const original=id?co.customers.find(x=>x.id===id):null;
 if(id&&!original)return toast('Customer not found.','err');
 const customer=id?Object.assign(clone(original),d):
  {id:uuid(),...d,archived:false,createdAt:new Date().toISOString()};
 if(atomicEnabled()){
  if(!(await atomicReady(co)))return;
  const before=coBody(co);
  const {data,error}=await SB.rpc('atomic_save_record',{
   p_company_id:co.id,p_kind:'customers',p_record:customer,
   p_expected:id?CM_EXPECTED:null
  });
  if(error||!data)return toast('Customer not saved: '+(error?.message||'Unknown server error'),'err');
  if(!atomicApply(co,data,before))return;
 }else{
  if(id){Object.assign(original,d);audit(co,'customer.update',original.name)}
  else{co.customers.push(customer);audit(co,'customer.create',customer.name)}
  save();
 }
 const e=custErrors(customer);CM_EXPECTED=null;
 closeModal();
 toast(e.length?'Saved — '+e.length+' e-Invoice detail(s) still missing':'Customer saved',e.length?'warn':'ok');
 if(CM_FROM_BUILDER&&ED){ED.customerId=customer.id;bRefresh()}
 else if(location.hash.includes('/customers'))drawCust();
}
async function verifyTinUI(){const co=CO();const tin=val('cm-tin').toUpperCase(),t=val('cm-idt'),v=val('cm-idv');const o=$('#cm-tinr');if(!tin||!v){o.innerHTML='<span style="color:var(--err)">Enter TIN and ID number first.</span>';return}if(!LHDN.base(co)){o.innerHTML='<span style="color:var(--warn)">LHDN backend not connected — format check only: '+(TIN_RE.test(tin)?'format OK':'format looks wrong')+'.</span>';return}
 o.textContent='Checking with LHDN…';try{await LHDN.call(co,'GET',`/api/v1.0/taxpayer/validate/${encodeURIComponent(tin)}?idType=${encodeURIComponent(t)}&idValue=${encodeURIComponent(v)}`);o.innerHTML='<span style="color:var(--ok)">✓ TIN and ID matched by LHDN.</span>'}catch(e){o.innerHTML=`<span style="color:var(--err)">${e.status===404||e.status===400?'Not matched by LHDN — check TIN and ID.':esc(e.message)}</span>`}}
async function archiveCust(id){
 const co=CO(),c=co.customers.find(x=>x.id===id);
 if(!c)return toast('Customer not found.','err');
 if(!can('Edit Draft'))return toast('Not allowed to edit customers.','err');
 if(atomicEnabled()){
  if(!(await atomicReady(co)))return;
  const before=coBody(co),updated={...clone(c),archived:!c.archived};
  const {data,error}=await SB.rpc('atomic_save_record',{
   p_company_id:co.id,p_kind:'customers',p_record:updated,p_expected:clone(c)
  });
  if(error||!data)return toast('Customer status not saved: '+(error?.message||'Unknown error'),'err');
  if(!atomicApply(co,data,before))return;
 }else{
  c.archived=!c.archived;
  audit(co,c.archived?'customer.archive':'customer.restore',c.name);
  save();
 }

}

 return `<div class="note mb">Buyers scan the QR, enter their own e-Invoice details on their phone, and you approve them into a customer record with a prefilled invoice. ${lim<Infinity?`Your plan allows ${lim} open requests.`:''}</div><div class="card">${l.length?`<div class="tw"><table class="t"><thead><tr><th>Request</th><th>Created</th><th>Expires</th><th>Status</th><th>Buyer</th><th></th></tr></thead><tbody>${l.map(r=>{const s=reqStatus(r);return `<tr><td><b>${esc(r.label)}</b><div class="muted sm">Receipt ${esc(r.receipt||'—')}</div></td><td>${fmtDate(r.createdAt)}</td><td>${fmtDate(r.expiresAt)}</td><td>${B(s)}</td><td>${esc(r.data?.name||'—')}</td><td class="r nowrap">${s==='Received'?`<button class="btn sm p" onclick="qrReview('${r.id}')">Review</button>`:''}${['Open','Expired'].includes(s)?`<button class="btn sm" onclick="qrShow('${r.id}')">${ic('qr',14)}QR</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`:empty('qr','No QR requests yet','Create a request per sale or a counter QR for walk-in buyers.',`<button class="btn p" onclick="qrNew()">New QR request</button>`)}</div>`}

async function saveProd(id){
 const co=CO();
 if(!can('Edit Draft'))return toast('Not allowed to edit products.','err');
 const d={name:val('pm-n'),desc:val('pm-d')||val('pm-n'),
  classCode:val('pm-c'),unitCode:val('pm-u'),price:toSen(val('pm-p')),
  taxType:val('pm-t'),taxRate:val('pm-t')==='06'?0:+val('pm-r')||0};
 if(!d.name)return toast('Name is required.','err');
 if(d.price<0)return toast('Price cannot be negative.','err');
 const original=id?co.products.find(x=>x.id===id):null;
 if(id&&!original)return toast('Product not found.','err');
 const product=id?Object.assign(clone(original),d):{id:uuid(),...d};
 if(atomicEnabled()){
  if(!(await atomicReady(co)))return;
  const before=coBody(co);
  const {data,error}=await SB.rpc('atomic_save_record',{
   p_company_id:co.id,p_kind:'products',p_record:product,
   p_expected:id?PROD_EXPECTED:null
  });
  if(error||!data)return toast('Product not saved: '+(error?.message||'Unknown error'),'err');
  if(!atomicApply(co,data,before))return;
 }else{
  if(id)Object.assign(original,d);
  else co.products.push(product);
  audit(co,'product.save',d.name);save();
 }
 PROD_EXPECTED=null;closeModal();rerender();
}

function importData(f){if(!f)return;const r=new FileReader();r.onload=async e=>{try{const d=JSON.parse(e.target.result);if(!d.id||!Array.isArray(d.invoices)||!Array.isArray(d.customers))throw 0;if(CLOUD){const co=Object.assign(newCompany({}),d,{id:uuid(),members:[{email:DB.session,name:user().name,role:'Owner',status:'active',at:new Date().toISOString()}]});co.invoices.forEach(i=>{i.lhdn={status:'Not Submitted',submissionUid:'',uuid:'',longId:'',validatedAt:'',errors:[],attempts:[]};delete i.share});if(!(await cloudCreate(co)))return;DB.companies.push(co);DB.currentId=co.id;toast('Imported as a new company (LHDN statuses are not copied)');return go('#/app/dashboard')}if(!d.members.some(m=>m.email===DB.session))d.members.push({email:DB.session,name:user().name,role:'Owner',status:'active',at:new Date().toISOString()});const i=DB.companies.findIndex(c=>c.id===d.id);if(i>=0)DB.companies[i]=d;else DB.companies.push(d);DB.currentId=d.id;save();toast('Company restored');go('#/app/dashboard')}catch(err){toast('Not a valid MYR Invoice export.','err')}};r.readAsText(f)}

 const k=(l,v,s)=>`<div class="card kpi myr-kpi"><div class="l">${l}<span class="dot">${ic(/revenue|subscription/i.test(l)?'card':/user|business|compan/i.test(l)?'users':/invalid|error|failure|warning/i.test(l)?'shield':/processing|queue/i.test(l)?'clock':'file',19)}</span></div><div class="v">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`;

 if(t==='businesses'){return adminShell(t,head('Businesses','Manage account status and plans. Invoice contents are not visible to platform admins.')+`<div class="card"><div class="ch"><input placeholder="Search company, owner or TIN" style="max-width:340px" oninput="$$('#admt tbody tr').forEach(tr=>tr.style.display=tr.textContent.toLowerCase().includes(this.value.toLowerCase())?'':'none')"><span class="muted sm">${R.length} businesses</span></div>${R.length?`<div class="tw"><table class="t" id="admt"><thead><tr><th>Company</th><th>Plan</th><th>Status</th><th class="r">Users</th><th class="r">Docs</th><th class="r">Valid</th><th class="r">Invalid</th><th class="r">Processing</th><th>Usage (month)</th><th>Last LHDN success</th><th></th></tr></thead><tbody>${R.map(r=>`<tr><td style="min-width:220px"><b>${esc(r.name)}</b><div class="muted sm">${esc(r.owner||'—')} · ${esc(r.tin||'no TIN')}</div><div class="muted sm">Since ${fmtDate(r.created_at)}</div></td><td><select style="width:auto;height:34px" onchange="adminSet('${r.id}',null,this.value)">${opt(PLANS.map(x=>[x.id,x.id]),r.plan)}</select></td><td>${B(r.status==='active'?'Active':'Suspended')}</td><td class="r">${r.members}</td><td class="r">${r.invoices}</td><td class="r">${r.valid}</td><td class="r" style="${r.invalid?'color:var(--err);font-weight:600':''}">${r.invalid}</td><td class="r">${r.processing}</td><td style="min-width:130px"><div class="meter"><i style="width:${Math.min(100,r.docs_month/lim(r.plan)*100)}%"></i></div><div class="muted sm">${r.docs_month} / ${lim(r.plan)}</div></td><td class="nowrap sm">${fmtDT(r.last_ok)}</td><td class="r">${r.status==='active'?`<button class="btn sm d" onclick="confirmBox('Suspend ${esc(r.name).replace(/'/g,'')}?','Members can still view but cannot change data or submit to LHDN.','Suspend',()=>adminSet('${r.id}','suspended'),true)">Suspend</button>`:`<button class="btn sm" onclick="adminSet('${r.id}','active')">Reactivate</button>`}</td></tr>`).join('')}</tbody></table></div>`:empty('brief','No businesses yet','Registered companies appear here.')}</div>`)}
 if(t==='subscriptions'){const by=PLANS.map(pl=>({...pl,n:active.filter(r=>r.plan===pl.id).length}));const near=R.filter(r=>r.docs_month>=lim(r.plan)*.8);
  return adminShell(t,head('Subscriptions','Plans, recurring revenue and quota pressure.')+`<div class="grid g4">${k('Monthly recurring revenue',money(active.reduce((a,r)=>a+price(r.plan)*100,0)),'List price, active companies')}${k('Active subscriptions',active.length,'')}${k('Suspended',R.length-active.length,'')}${k('Near quota (≥80%)',near.length,'this month')}</div>
  <div class="grid g2 mt"><div class="card pad"><h3 class="mb">Plan distribution</h3>${by.map(pl=>`<div class="row sb sm" style="padding:6px 0"><span>${pl.id} · RM${pl.price}</span><b>${pl.n}</b></div><div class="meter"><i style="width:${active.length?pl.n/active.length*100:0}%"></i></div>`).join('')}</div>
  <div class="card pad"><h3 class="mb">Quota warnings</h3>${near.length?near.map(r=>`<div class="row sb sm" style="padding:6px 0;border-bottom:1px solid var(--line)"><span>${esc(r.name)} · ${esc(r.plan)}</span><b>${r.docs_month}/${lim(r.plan)}</b></div>`).join(''):'<p class="muted sm">No company is near its limit.</p>'}</div></div>
  <div class="note mt">Subscription payments and billing history require the payment gateway integration. Plan changes are made here by platform admins and are recorded in the audit log. Plan limits and prices can be configured in <code>config.js</code> (<code>plans</code>).</div>`)}
 if(t==='monitor'){const ev=D.events;const cnt=kd=>ev.filter(e=>e.kind===kd).length;const stuck=R.filter(r=>r.processing>0);
  return adminShell(t,head('LHDN API Monitor','Submission health across all companies. External LHDN processing time is separate from app performance.')+`<div class="grid g4">${k('Validation failure rate',done?Math.round(sum('invalid')/done*100)+'%':'—',sum('invalid')+' invalid of '+done)}${k('Processing backlog',sum('processing'),stuck.length+' companies')}${k('Rate-limit events (429)',cnt('429'),'')}${k('Auth / permission errors',cnt('auth'),cnt('5xx')+' server errors (5xx)')}</div>
  ${sum('invalid')&&done&&sum('invalid')/done>.2?'<div class="note e mt"><b>Alert:</b> validation failure rate is above 20%. Check recent changes and common errors.</div>':''}
  <div class="grid g2 mt"><div class="card"><div class="ch"><h3>Recent incidents</h3></div>${ev.length?`<div class="tw"><table class="t" style="min-width:480px"><thead><tr><th>Time</th><th>Company</th><th>Type</th><th>Detail</th></tr></thead><tbody>${ev.slice(0,100).map(e=>`<tr><td class="nowrap sm">${fmtDT(e.created_at)}</td><td class="sm">${esc(e.company||'—')}</td><td><span class="badge ${e.kind==='429'?'b-warn':'b-err'}">${esc(e.kind)}</span></td><td class="sm mono">${esc(e.detail)}</td></tr>`).join('')}</tbody></table></div>`:`<p class="muted pad">No incidents recorded.</p>`}</div>
  <div class="card"><div class="ch"><h3>Documents awaiting validation</h3></div>${stuck.length?stuck.map(r=>`<div class="row sb pad-s" style="border-bottom:1px solid var(--line)"><span>${esc(r.name)}</span><b>${r.processing}</b></div>`).join(''):`<p class="muted pad">Nothing processing.</p>`}</div></div>`)}
 if(t==='users')return adminShell(t,head('Users','Registered accounts. Platform admins cannot impersonate users.')+`<div class="card">${D.users.length?`<div class="tw"><table class="t"><thead><tr><th>User</th><th>Registered</th><th>Last sign-in</th><th class="r">Companies</th><th>Role</th></tr></thead><tbody>${D.users.map(u=>`<tr><td><b>${esc(u.name||u.email)}</b><div class="muted sm">${esc(u.email)}</div></td><td>${fmtDate(u.created_at)}</td><td>${fmtDT(u.last_sign_in_at)}</td><td class="r">${u.companies}</td><td>${u.is_admin?'<span class="badge b-navy">Platform admin</span>':'<span class="badge">User</span>'}</td></tr>`).join('')}</tbody></table></div>`:empty('users','No users','')}</div>`);
 if(t==='demo'){const demos=DB.companies.filter(c=>c.demo);const docs=demos.reduce((n,c)=>n+c.invoices.length,0);
  return adminShell(t,head('Demo Lab','Test MYR Invoice without a personal passport, taxpayer TIN or registered company.')+
  '<div class="note w mb"><b>Safe testing only:</b> All sample company details and invoices are fictional. No LHDN API submissions, taxpayer registration or public buyer links are made from Demo Lab. Demonstration results are not official LHDN approvals.</div>'+
  '<div class="grid g3">'+k('Demo workspaces',demos.length,'Owned by this admin')+k('Sample invoices',docs,'Draft data only')+k('Real LHDN submissions','Blocked','Server-side safety protection')+'</div>'+
  '<div class="card pad mt"><h3 class="mb8">Your demo workspace</h3><p class="muted sm mb">Create an isolated fictional company with sample customers, products, invoices and payment records. Your existing company remains unchanged.</p>'+
  (demos.length?demos.map(c=>'<div class="row sb" style="gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap"><div><b>'+esc(c.name)+'</b><div class="muted sm">'+c.invoices.length+' invoices · '+c.customers.length+' customers · '+c.products.length+' products</div></div><button class="btn p sm" onclick="openDemo(\''+c.id+'\')">Open demo workspace</button></div>').join(''):'<button class="btn p" onclick="demoCompany()">Create fictional demo workspace</button>')+
  '</div><div class="card pad mt"><h3 class="mb8">Recommended tests</h3><p class="muted sm">Create an invoice → save a draft → edit items → print/download PDF → record a payment → review reports. Use E-Invoice Centre for local compliance validation only.</p><p class="muted sm mt8">To test real MyInvois submission later, a registered taxpayer must separately authorize the intermediary.</p><div class="row mt" style="gap:10px;flex-wrap:wrap"><button class="btn sm" onclick="previewDemoLhdn(\'valid\')">Preview simulated acceptance</button><button class="btn sm" onclick="previewDemoLhdn(\'invalid\')">Preview simulated rejection</button></div></div>')}
 if(t==='integrity'){
  const title=head('Data Integrity','Compare each company’s original records with the separate database mirrors. No customer or invoice contents are shown.');
  if(!CLOUD)return adminShell(t,title+'<div class="note w">Live reconciliation is available only in cloud mode.</div>');
  if(!PARITY.loaded){adminLoadParity();return adminShell(t,title+'<div class="card pad">Checking protected database records…</div>')}
  const fields=[['Customers','customers'],['Products','products'],['Invoices','invoices'],['Invoice items','lines'],['Payments','payments']];
  const good=r=>fields.every(([,key])=>r[key+'_match']===true);
  const passed=PARITY.rows.filter(good).length,failed=PARITY.rows.length-passed;
  const name=r=>(R.find(c=>c.id===r.company_id)?.name)||('Company '+String(r.company_id).slice(0,8));
  return adminShell(t,title+
    (PARITY.err?'<div class="note e mb">'+esc(PARITY.err)+'</div>':'')+
    '<div class="row mb" style="justify-content:flex-end"><button class="btn sm" onclick="PARITY.loaded=false;route()">Run check again</button></div>'+
    '<div class="grid g3">'+k('Companies checked',PARITY.rows.length,'Including demo workspaces')+
    k('Matching',passed,'All five record groups')+
    k('Require investigation',failed,'Do not cut over until zero')+'</div>'+
    (failed?'<div class="note w mt"><b>Reconciliation mismatch detected.</b> The old database remains authoritative. Investigate these records before any cutover.</div>':'<div class="note ok mt">All checked records match their database mirrors. This is not a final production cutover approval.</div>')+
    '<div class="grid g3 mt">'+k('Private revision copies',PARITY.recovery.reduce((a,r)=>a+(+r.revisions||0),0),'Same database only')+k('Pre-cutover snapshots',PARITY.recovery.reduce((a,r)=>a+(+r.precutover_snapshots||0),0),'Rollback reference')+k('Offsite backup','Not verified','Required before final cutover')+'</div>'+ 
    '<div class="card mt"><div class="ch"><h3>Company data reconciliation</h3></div>'+
    '<div class="tw"><table class="t"><thead><tr><th>Company</th>'+
    fields.map(([label])=>'<th>'+label+'</th>').join('')+'<th>Result</th></tr></thead><tbody>'+
    PARITY.rows.map(r=>'<tr><td><b>'+esc(name(r))+'</b><div class="muted sm">'+esc(String(r.company_id).slice(0,8))+'</div></td>'+
      fields.map(([,key])=>'<td class="nowrap">'+r['source_'+key]+' / '+r['mirror_'+key]+' '+(r[key+'_match']?'✓':'✕')+'</td>').join('')+
      '<td>'+ (good(r)?'<span class="badge b-ok">Match</span>':'<span class="badge b-err">Mismatch</span>') +'</td></tr>').join('')+
    '</tbody></table></div></div>'+
    '<div class="note mt">Source / Mirror counts. Private recovery copies are stored in the same database and do not replace an offsite backup. Full canonical cutover remains pending final browser and recovery tests.</div>');
 }
 if(t==='security')return adminShell(t,head('Security & Audit','Platform controls and admin action history.')+`<div class="grid g2"><div class="card pad"><h3 class="mb">Platform safeguards</h3>${[['Tenant isolation','Row-level security by company membership (verified email).'],['Official status integrity','LHDN results are written only by the server function; browsers cannot mark a document Valid.'],['Secrets','LHDN credentials live in Supabase Edge Function secrets, never in the browser.'],['Admin visibility','Admins see aggregates only — no invoice contents and no impersonation.'],['Append-only audit','Audit log rows cannot be edited or deleted by users.'],['Public links','Buyer QR and invoice links are random tokens with expiry and submission limits.']].map(([a,b])=>`<div class="list-i"><span class="pri l"></span><div><b class="sm">${a}</b><div class="muted sm">${b}</div></div></div>`).join('')}</div>
  <div class="card"><div class="ch"><h3>Admin actions</h3></div>${D.audit.length?D.audit.slice(0,50).map(a=>`<div class="pad-s sm" style="border-bottom:1px solid var(--line)"><b>${esc(a.action)}</b> <span class="muted">${esc(a.detail)}</span><div class="muted" style="font-size:11.5px">${fmtDT(a.created_at)} · ${esc(a.actor_email)}</div></div>`).join(''):`<p class="muted pad">No admin actions yet.</p>`}</div></div>`);
 const newR=R.filter(r=>r.created_at&&new Date(r.created_at)>new Date(Date.now()-30*864e5)).length;
 return adminShell(t,`<div class="myr-welcome"><div class="myr-welcome-top"><span class="myr-eyebrow">PLATFORM CONTROL CENTRE</span><span class="myr-date">${esc(new Date().toLocaleDateString('en-MY',{weekday:'short',day:'numeric',month:'short',year:'numeric',timeZone:'Asia/Kuala_Lumpur'}))}</span></div>`+head('Platform overview','Manage businesses, subscriptions and platform operations.')+`</div><div class="myr-section-label"><h2>Platform overview</h2><span>Account and usage aggregates</span></div><div class="grid g4 myr-kpis">${k('Registered businesses',R.length,newR+' new in 30 days')}${k('Active subscriptions',active.length,(R.length-active.length)+' suspended')}${k('Estimated monthly plan value',money(active.reduce((a,r)=>a+price(r.plan)*100,0)),'List price · not collected revenue')}${k('Users',D.users.length,'')}</div>
 <div class="myr-section-label myr-section-spaced"><h2>Document operations</h2><span>Recorded document statuses</span></div><div class="grid g4 mt myr-kpis">${k('Total documents',sum('invoices'),'')}${k('LHDN valid',sum('valid'),'')}${k('Invalid',sum('invalid'),done?Math.round(sum('invalid')/done*100)+'% failure rate':'')}${k('Processing queue',sum('processing'),D.events.filter(e=>e.kind==='429').length+' rate-limit events')}</div>
 <div class="grid g2 mt"><div class="card"><div class="ch"><h3>Newest businesses</h3><a class="btn g sm" href="#/admin/businesses">All</a></div>${R.slice(0,6).map(r=>`<div class="row sb pad-s" style="border-bottom:1px solid var(--line)"><div><b class="sm">${esc(r.name)}</b><div class="muted sm">${esc(r.owner||'')} · ${fmtDate(r.created_at)}</div></div><div class="row">${B(r.status==='active'?'Active':'Suspended')}<span class="badge">${esc(r.plan)}</span></div></div>`).join('')||'<p class="muted pad">None yet.</p>'}</div>
 <div class="card"><div class="ch"><h3>Recent LHDN incidents</h3><a class="btn g sm" href="#/admin/monitor">Monitor</a></div>${D.events.slice(0,6).map(e=>`<div class="pad-s sm" style="border-bottom:1px solid var(--line)"><span class="badge ${e.kind==='429'?'b-warn':'b-err'}">${esc(e.kind)}</span> ${esc(e.company||'')} <span class="muted mono">${esc(e.detail)}</span><div class="muted" style="font-size:11.5px">${fmtDT(e.created_at)}</div></div>`).join('')||'<p class="muted pad">No incidents.</p>'}</div></div>`)}
async function adminSet(id,status,plan){if(CLOUD){const {error}=await SB.rpc('admin_set_company',{p_id:id,p_status:status||null,p_plan:plan||null});if(error)return toast(error.message,'err');ADM.loaded=false;const c=DB.companies.find(x=>x.id===id);if(c){if(status)c.status=status;if(plan)c.plan=plan}}
 else{const c=DB.companies.find(x=>x.id===id);if(!c)return;if(status)c.status=status;if(plan)c.plan=plan;audit(c,'admin.company',[status&&'status='+status,plan&&'plan='+plan].filter(Boolean).join(' '));save()}toast('Company updated');route()}

/* ================= Boot ================= */
(async()=>{if(CLOUD&&!/^#\/(r|v)\//.test(location.hash)){paint(`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px">${LOGO(44)}<div class="muted">Loading MYR Invoice…</div></div>`);try{await cloudInit()}catch(e){return paint(`<div class="mobile-page"><div class="box">${empty('alert','Could not connect',esc(e.message||String(e))+'<br>Check config.js (Supabase URL and anon key) and your internet connection.','<button class="btn p" onclick="location.reload()">Retry</button>')}</div></div>`)}}route()})();
if(CLOUD)window.addEventListener('beforeunload',e=>{if(PUSH_T||PUSHING||UNSYNCED_CLOUD){cloudPush();e.preventDefault();e.returnValue=''}});
</script>
